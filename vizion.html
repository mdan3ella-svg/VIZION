<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VERTASCAN VIZION™ — Architectural Visualization &amp; Look Development</title>
<meta name="description" content="Browser-based architectural visualization, look development, progressive path-accumulated rendering, colour grading and client presentation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#07090B; --graphite:#0E1216; --panel:rgba(18,23,28,.86); --panel-solid:#131920;
  --raise:#1A222A; --raise-2:#222C36; --line:#232D37; --line-soft:#182028;
  --ink:#E9EFF5; --ink-2:#98A5B2; --ink-3:#606D7A;
  --solar:#FFB454; --solar-2:#F08A2E; --solar-dim:rgba(255,180,84,.14);
  --azure:#5EC8D8; --alert:#FF6B5A; --ok:#7BD88F;
  --h-top:46px; --h-bot:26px; --w-left:268px; --w-right:322px; --dock:0px;
  --fx:'Archivo',system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:'JetBrains Mono',ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--void);color:var(--ink);font-family:var(--fx);
  font-size:12px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--raise-2);border:2px solid transparent;background-clip:content-box;border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:#31404E;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:1.5px solid var(--solar);outline-offset:1px}
.skip{position:absolute;left:-999px;top:0;z-index:99}
.skip:focus{left:8px;top:8px;padding:8px 12px;background:var(--solar);color:#12161A;border-radius:3px}

/* ── shell ─────────────────────────────────────────────── */
#app{display:grid;height:100%;
  grid-template-columns:var(--w-left) minmax(0,1fr) var(--w-right);
  grid-template-rows:var(--h-top) minmax(0,1fr) var(--dock) var(--h-bot);
  grid-template-areas:"top top top" "left view right" "dock dock dock" "bot bot bot";
  background:
    radial-gradient(1200px 700px at 70% -10%, rgba(255,180,84,.05), transparent 60%),
    radial-gradient(900px 600px at 5% 110%, rgba(94,200,216,.045), transparent 60%),
    var(--void);}
.top{grid-area:top;display:flex;align-items:center;gap:0;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,#12181E,#0D1217);position:relative;z-index:30}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;
  background:linear-gradient(90deg,var(--solar),transparent 38%);opacity:.55}
.brand{display:flex;align-items:baseline;gap:7px;padding:0 14px 0 16px;height:100%;
  border-right:1px solid var(--line)}
.brand b{font-weight:700;letter-spacing:.14em;font-size:12px}
.brand span{font-family:var(--fm);font-size:9.5px;color:var(--solar);letter-spacing:.18em}
.brand i{font-style:normal;color:var(--ink-3);font-size:8px;transform:translateY(-4px)}

.wtabs{display:flex;height:100%;overflow-x:auto;scrollbar-width:none}
.wtabs::-webkit-scrollbar{display:none}
.wtab{position:relative;background:none;border:0;border-right:1px solid var(--line-soft);
  padding:0 15px;height:100%;color:var(--ink-3);letter-spacing:.13em;font-size:10px;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:color .18s,background .18s}
.wtab:hover{color:var(--ink-2);background:rgba(255,255,255,.025)}
.wtab[aria-selected="true"]{color:var(--ink)}
.wtab:after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--solar);
  transform:scaleX(0);transform-origin:left;transition:transform .22s cubic-bezier(.2,.9,.25,1)}
.wtab[aria-selected="true"]:after{transform:scaleX(1)}
.wtab u{display:block;font-family:var(--fm);font-size:8px;color:var(--ink-3);text-decoration:none;letter-spacing:.1em;margin-top:1px}

.topright{margin-left:auto;display:flex;align-items:center;gap:8px;padding:0 12px}
.chip{font-family:var(--fm);font-size:9.5px;color:var(--ink-2);background:var(--raise);
  border:1px solid var(--line);border-radius:3px;padding:4px 8px;letter-spacing:.06em;white-space:nowrap}
.chip b{color:var(--solar);font-weight:500}

/* ── panels ────────────────────────────────────────────── */
.pane{background:var(--panel);backdrop-filter:blur(20px) saturate(1.25);
  -webkit-backdrop-filter:blur(20px) saturate(1.25);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pane.left{grid-area:left;border-right:1px solid var(--line)}
.pane.right{grid-area:right;border-left:1px solid var(--line)}
.pane-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);
  font-size:9.5px;letter-spacing:.16em;font-weight:600;color:var(--ink-2);flex:0 0 auto}
.pane-h em{font-style:normal;margin-left:auto;font-family:var(--fm);font-size:9px;color:var(--ink-3);letter-spacing:.04em}
.pane-b{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding-bottom:24px}

.grp{border-bottom:1px solid var(--line-soft)}
.grp>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:9px 12px;font-size:10px;letter-spacing:.13em;font-weight:600;color:var(--ink-2);user-select:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary:hover{color:var(--ink);background:rgba(255,255,255,.02)}
.grp>summary:before{content:"";width:5px;height:5px;border-right:1.4px solid var(--solar);
  border-bottom:1.4px solid var(--solar);transform:rotate(-45deg);transition:transform .2s;flex:0 0 auto;margin-left:1px}
.grp[open]>summary:before{transform:rotate(45deg)}
.grp>summary>i{font-style:normal;margin-left:auto;font-family:var(--fm);font-size:8.5px;color:var(--ink-3);letter-spacing:.05em}
.grp-b{padding:4px 12px 12px}

/* ── controls ──────────────────────────────────────────── */
.row{display:flex;align-items:center;gap:8px;margin:7px 0;min-height:20px}
.row>label{flex:0 0 92px;color:var(--ink-2);font-size:10.5px;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.wide>label{flex:0 0 auto;margin-bottom:2px}
.row.col{display:block}
.sld{flex:1 1 auto;display:flex;align-items:center;gap:8px;min-width:0}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1 1 auto;min-width:0;height:16px;background:none;cursor:ew-resize}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--raise-2);border-radius:2px}
input[type=range]::-moz-range-track{height:2px;background:var(--raise-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:9px;height:9px;border-radius:50%;
  background:var(--ink);margin-top:-3.5px;box-shadow:0 0 0 0 var(--solar-dim);transition:box-shadow .16s,background .16s}
input[type=range]::-moz-range-thumb{width:9px;height:9px;border:0;border-radius:50%;background:var(--ink)}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{background:var(--solar);box-shadow:0 0 0 5px var(--solar-dim)}
.num{flex:0 0 52px;text-align:right;font-family:var(--fm);font-size:10px;color:var(--ink);
  background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:3px 5px}
.num:focus{border-color:var(--solar)}
select,.txt{flex:1 1 auto;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:3px;
  padding:4px 6px;font-size:10.5px;color:var(--ink);cursor:pointer}
select:hover,.txt:hover{border-color:var(--raise-2)}
input[type=color]{flex:0 0 34px;height:20px;padding:0;background:none;border:1px solid var(--line);border-radius:3px;cursor:pointer}
.btn{background:var(--raise);border:1px solid var(--line);border-radius:3px;padding:6px 9px;
  font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--ink-2);cursor:pointer;
  transition:.15s;white-space:nowrap}
.btn:hover{background:var(--raise-2);color:var(--ink);border-color:#2E3A46}
.btn:active{transform:translateY(1px)}
.btn.pri{background:linear-gradient(180deg,var(--solar),var(--solar-2));border-color:#C97A26;color:#1A1207}
.btn.pri:hover{filter:brightness(1.08);color:#1A1207}
.btn.gho{background:none}
.btn[aria-pressed="true"]{background:var(--solar-dim);border-color:var(--solar);color:var(--solar)}
.btns{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 2px}
.btns .btn{flex:1 1 auto}
.tgl{position:relative;flex:0 0 30px;height:16px;border-radius:9px;background:var(--raise-2);
  border:1px solid var(--line);cursor:pointer;transition:.18s;padding:0}
.tgl:after{content:"";position:absolute;top:1px;left:1px;width:12px;height:12px;border-radius:50%;
  background:var(--ink-3);transition:.18s cubic-bezier(.2,.9,.25,1)}
.tgl[aria-pressed="true"]{background:var(--solar-dim);border-color:var(--solar)}
.tgl[aria-pressed="true"]:after{transform:translateX(14px);background:var(--solar)}
.seg{display:flex;flex:1 1 auto;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1 1 0;background:var(--raise);border:0;border-right:1px solid var(--line);
  padding:5px 2px;font-size:9.5px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);cursor:pointer;transition:.15s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--solar-dim);color:var(--solar)}
.hint{color:var(--ink-3);font-size:9.5px;line-height:1.5;margin:6px 0 2px}
.hr{height:1px;background:var(--line-soft);margin:10px 0}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:7px;padding:6px 12px;cursor:pointer;
  border-left:2px solid transparent;color:var(--ink-2);font-size:10.5px;transition:background .12s}
.item:hover{background:rgba(255,255,255,.03);color:var(--ink)}
.item[aria-selected="true"]{background:var(--solar-dim);border-left-color:var(--solar);color:var(--ink)}
.item .sw{flex:0 0 12px;height:12px;border-radius:2px;border:1px solid rgba(255,255,255,.14)}
.item .dot{flex:0 0 5px;height:5px;border-radius:50%;background:var(--ink-3)}
.item em{font-style:normal;margin-left:auto;font-family:var(--fm);font-size:8.5px;color:var(--ink-3)}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:18px 14px;color:var(--ink-3);font-size:10px;line-height:1.6}

/* ── viewport ──────────────────────────────────────────── */
.view{grid-area:view;position:relative;min-width:0;min-height:0;overflow:hidden;background:#05070A}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.overlay{position:absolute;inset:0;pointer-events:none}
.hud{position:absolute;pointer-events:none;font-family:var(--fm);font-size:9.5px;letter-spacing:.06em;
  color:var(--ink-2);text-shadow:0 1px 3px rgba(0,0,0,.8)}
.hud.tl{top:10px;left:12px;display:flex;flex-direction:column;gap:3px}
.hud.tr{top:10px;right:12px;text-align:right;display:flex;flex-direction:column;gap:3px}
.hud.bl{bottom:10px;left:12px;display:flex;gap:10px;align-items:center}
.hud b{color:var(--solar);font-weight:500}
.vtools{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;
  background:rgba(10,14,18,.78);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:4px;padding:3px;pointer-events:auto;z-index:5}
.vtools button{background:none;border:0;border-radius:3px;padding:5px 9px;font-size:9.5px;font-weight:600;
  letter-spacing:.07em;color:var(--ink-3);cursor:pointer;transition:.14s}
.vtools button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.vtools button[aria-pressed="true"]{color:var(--solar);background:var(--solar-dim)}
.ring{position:absolute;right:14px;bottom:14px;width:52px;height:52px;pointer-events:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .t{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fm);
  font-size:9px;color:var(--ink-2);transform:none}
.badge{position:absolute;left:50%;top:56px;transform:translateX(-50%);font-family:var(--fm);font-size:10px;
  letter-spacing:.14em;color:#12161A;background:var(--solar);padding:3px 10px;border-radius:2px;
  opacity:0;transition:opacity .3s;pointer-events:none}
.badge.on{opacity:1}
.drop{position:absolute;inset:0;display:none;place-items:center;background:rgba(7,9,11,.86);
  border:2px dashed var(--solar);z-index:20;font-size:13px;letter-spacing:.14em;color:var(--solar)}
.drop.on{display:grid}

/* dock */
.dockbar{grid-area:dock;display:none;border-top:1px solid var(--line);background:var(--panel-solid);
  overflow-x:auto;overflow-y:hidden}
#app.hasdock{--dock:132px}
#app.hasdock .dockbar{display:block}
.strip{display:flex;gap:8px;padding:10px 12px;height:100%;align-items:stretch}
.card{flex:0 0 auto;width:150px;border:1px solid var(--line);border-radius:3px;overflow:hidden;
  background:var(--raise);cursor:pointer;display:flex;flex-direction:column;transition:.15s}
.card:hover{border-color:var(--solar);transform:translateY(-2px)}
.card img{width:100%;height:78px;object-fit:cover;display:block;background:#0A0E12}
.card .cap{padding:4px 6px;font-family:var(--fm);font-size:8.5px;color:var(--ink-2);
  display:flex;justify-content:space-between;gap:6px}
.card .cap b{color:var(--solar);font-weight:500}
.card.add{width:112px;display:grid;place-items:center;border-style:dashed;color:var(--ink-3);font-size:10px;letter-spacing:.1em}

/* node strip */
.nodes{display:flex;align-items:center;gap:0;padding:14px 12px;height:100%}
.node{flex:0 0 auto;width:118px;border:1px solid var(--line);border-radius:3px;background:var(--raise);
  padding:7px 8px;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--raise-2)}
.node[aria-selected="true"]{border-color:var(--solar);box-shadow:0 0 0 1px var(--solar-dim)}
.node[data-off="1"]{opacity:.38}
.node h4{font-size:9.5px;letter-spacing:.1em;font-weight:600;color:var(--ink);margin-bottom:3px}
.node p{font-family:var(--fm);font-size:8.5px;color:var(--ink-3)}
.wire{flex:0 0 22px;height:1px;background:var(--line);position:relative}
.wire:after{content:"";position:absolute;right:-1px;top:-2px;width:0;height:0;
  border-left:4px solid var(--line);border-top:2.5px solid transparent;border-bottom:2.5px solid transparent}

/* status */
.bot{grid-area:bot;display:flex;align-items:center;gap:14px;padding:0 12px;border-top:1px solid var(--line);
  background:#0B1015;font-family:var(--fm);font-size:9px;letter-spacing:.06em;color:var(--ink-3);overflow:hidden}
.bot b{color:var(--ink-2);font-weight:400}
.bot .sep{width:1px;height:12px;background:var(--line)}
.bot .msg{margin-left:auto;color:var(--solar);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* sun dial signature */
.dial{position:relative;width:100%;max-width:230px;margin:2px auto 8px;aspect-ratio:1/1}
.dial svg{width:100%;height:100%;display:block;overflow:visible}
.dial .rd{stroke:var(--line);fill:none;stroke-width:1}
.dial .pathline{stroke:var(--solar);fill:none;stroke-width:1.4;opacity:.85}
.dial .pathghost{stroke:var(--ink-3);fill:none;stroke-width:1;opacity:.35;stroke-dasharray:2 3}
.dial .lbl{fill:var(--ink-3);font-family:var(--fm);font-size:7px;letter-spacing:.08em}
.dial .bead{fill:var(--solar)}
.dial .horizon{stroke:var(--raise-2);stroke-width:1}

/* scopes */
.scope{width:100%;height:86px;background:#0A0E12;border:1px solid var(--line);border-radius:3px;display:block;margin:4px 0}
.wheelrow{display:flex;gap:8px;margin:8px 0}
.wheel{flex:1 1 0;text-align:center}
.wheel canvas{width:100%;max-width:78px;aspect-ratio:1;border-radius:50%;cursor:crosshair;
  border:1px solid var(--line);background:#0A0E12}
.wheel span{display:block;font-family:var(--fm);font-size:8.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.1em}
.curve{width:100%;aspect-ratio:1/.7;background:#0A0E12;border:1px solid var(--line);border-radius:3px;display:block;cursor:crosshair}

/* modal */
.modal{position:fixed;inset:0;z-index:80;display:none;place-items:center;background:rgba(4,6,8,.72);
  backdrop-filter:blur(6px);padding:20px}
.modal.on{display:grid}
.sheet{width:min(720px,100%);max-height:86vh;overflow:auto;background:var(--panel-solid);
  border:1px solid var(--line);border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.sheet header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet header h2{font-size:12px;letter-spacing:.16em;font-weight:700}
.sheet header .btn{margin-left:auto}
.sheet .body{padding:16px}
.sheet .body h3{font-size:10px;letter-spacing:.14em;color:var(--solar);margin:14px 0 6px}
.sheet .body h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 12px;font-size:10.5px;color:var(--ink-2);line-height:1.65}
.kv b{font-family:var(--fm);font-size:9.5px;color:var(--ink);font-weight:500}
.sheet .body .grp{margin-bottom:8px;border:1px solid var(--line);border-radius:9px;background:rgba(10,14,18,.55)}
.sheet .body .grp>summary{padding:11px 13px}
.sheet .body .grp .grp-b{padding:4px 13px 13px}
.sheet .body .grp+.grp{margin-top:0}
.info-p{font-size:11px;line-height:1.75;color:var(--ink-2);margin:0 0 11px}
.info-p b{color:var(--ink);font-weight:600}
.info-tbl{width:100%;border-collapse:collapse;font-size:10px;color:var(--ink-2);margin:2px 0 12px}
.info-tbl th{text-align:left;font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--solar);
  font-weight:600;padding:0 10px 5px 0;border-bottom:1px solid var(--line)}
.info-tbl td{padding:5px 10px 5px 0;border-bottom:1px solid rgba(35,45,55,.55);vertical-align:top}
.info-tbl td:first-child{color:var(--ink)}
.info-tbl tr:last-child td{border-bottom:0}
.legal{font-family:var(--fm);font-size:9px;line-height:1.62;color:var(--ink-2);white-space:pre-wrap;
  max-height:320px;overflow:auto;background:#080B0E;border:1px solid var(--line);border-radius:8px;
  padding:13px;margin:4px 0 10px;-webkit-overflow-scrolling:touch}
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.boards figure{border:1px solid var(--line);border-radius:3px;overflow:hidden;background:var(--raise)}
.boards img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}
.boards figcaption{padding:6px 8px;font-family:var(--fm);font-size:8.5px;color:var(--ink-2);
  display:flex;justify-content:space-between;gap:6px}

/* mobile */
.mtabs{display:none}
@media (max-width:1080px){
  #app{grid-template-columns:0 minmax(0,1fr) 0}
  .pane{position:absolute;top:var(--h-top);bottom:var(--h-bot);width:290px;z-index:40;
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.9,.25,1);
    background:rgba(13,17,22,.97)}
  .pane.right{right:0;transform:translateX(102%)}
  .pane.open{transform:none}
  .mtabs{display:flex;gap:4px;padding:0 8px 0 4px}
  .brand{padding:0 10px;border:0}
  .brand span,.brand i{display:none}
  .topright .chip.hideS{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<a class="skip" href="#gl">Skip to viewport</a>
<div id="app">

  <header class="top">
    <div class="brand"><b>VERTASCAN</b><span>VIZION</span><i>™</i></div>
    <div class="mtabs">
      <button class="btn gho" id="mLeft" aria-label="Toggle browser panel">BROWSER</button>
      <button class="btn gho" id="mRight" aria-label="Toggle inspector panel">INSPECT</button>
    </div>
    <nav class="wtabs" id="wtabs" role="tablist" aria-label="Workspaces"></nav>
    <div class="topright">
      <span class="chip hideS" id="chipMode">MODE <b>HYBRID</b></span>
      <span class="chip hideS" id="chipRes">—</span>
      <button class="btn" id="btnCapture" title="Capture shot (C)">CAPTURE</button>
      <button class="btn pri" id="btnRender" title="Render still at print resolution">RENDER</button>
      <button class="btn gho" id="btnInfo" title="About, readme and license (I)" aria-label="About, readme and license">ABOUT</button>
      <button class="btn gho" id="btnHelp" title="Help (H)" aria-label="Help">?</button>
    </div>
  </header>

/* ── solar position (NOAA low-precision, ±0.02°) ──────────────── */
function sunPosition(lat, lon, date, tzHours){
  const d = date;
  const dayMs = Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
  const jd = dayMs / 86400000 + 2440587.5;
  const t  = (jd - 2451545.0) / 36525.0;
  const L0 = (280.46646 + t * (36000.76983 + t * 0.0003032)) % 360;
  const M  = 357.52911 + t * (35999.05029 - 0.0001537 * t);
  const e  = 0.016708634 - t * (0.000042037 + 0.0000001267 * t);
  const Mr = M * DEG;
  const C  = Math.sin(Mr) * (1.914602 - t * (0.004817 + 0.000014 * t))
           + Math.sin(2 * Mr) * (0.019993 - 0.000101 * t) + Math.sin(3 * Mr) * 0.000289;
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * t;
  const lambda = (trueLong - 0.00569 - 0.00478 * Math.sin(omega * DEG)) * DEG;
  const seconds = 21.448 - t * (46.815 + t * (0.00059 - t * 0.001813));
  const e0 = 23 + (26 + seconds / 60) / 60;
  const eps = (e0 + 0.00256 * Math.cos(omega * DEG)) * DEG;
  const decl = Math.asin(Math.sin(eps) * Math.sin(lambda));
  const y = Math.tan(eps / 2) ** 2;
  const L0r = L0 * DEG;
  const eqTime = 4 / DEG * (y * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr)
    + 4 * e * y * Math.sin(Mr) * Math.cos(2 * L0r) - 0.5 * y * y * Math.sin(4 * L0r)
    - 1.25 * e * e * Math.sin(2 * Mr));
  const minutes = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  let tst = (minutes + eqTime + 4 * lon - 60 * tzHours) % 1440;
  if (tst < 0) tst += 1440;
  let ha = tst / 4 - 180; if (ha < -180) ha += 360;
  const latR = lat * DEG, haR = ha * DEG;
  const cosZ = clamp(Math.sin(latR) * Math.sin(decl) + Math.cos(latR) * Math.cos(decl) * Math.cos(haR), -1, 1);
  const zenith = Math.acos(cosZ);
  let az = Math.acos(clamp((Math.sin(latR) * cosZ - Math.sin(decl)) / (Math.cos(latR) * Math.sin(zenith)), -1, 1));
  az = (ha > 0) ? (Math.PI + az) : (Math.PI * 3 - az);
  az %= Math.PI * 2;
  const alt = Math.PI / 2 - zenith;
  // refraction near horizon
  const altDeg = alt / DEG;
  let refr = 0;
  if (altDeg < 85 && altDeg > -1){ const te = Math.tan(alt);
    refr = (altDeg > 5) ? (58.1 / te - 0.07 / te ** 3 + 0.000086 / te ** 5)
         : (altDeg > -0.575 ? 1735 + altDeg * (-518.2 + altDeg * (103.4 + altDeg * (-12.79 + altDeg * 0.711))) : -20.774 / te);
    refr /= 3600; }
  return { azimuth: az, altitude: alt + refr * DEG, declination: decl };
}

}

/* ── SKY (Preetham analytic + procedural cloud deck) ───────────── */
const skyUni = {
  uSun:{ value:new THREE.Vector3(0.3,0.5,0.4) }, uTurb:{ value:2.6 }, uRayleigh:{ value:1.6 },
  uMie:{ value:0.006 }, uMieG:{ value:0.82 }, uClouds:{ value:0.32 }, uCloudSpeed:{ value:0.06 },

  side:THREE.BackSide, depthWrite:false, depthTest:false, fog:false, uniforms:skyUni,
  vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position);
    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader:`
  varying vec3 vDir;
  uniform vec3 uSun; uniform float uTurb,uRayleigh,uMie,uMieG,uClouds,uCloudSpeed,uTime,uSkyI,uHaze,uNight;
  const float PI = 3.141592653589793;
  const vec3  totalRayleigh = vec3(5.804542996261093E-6,1.3562911419845635E-5,3.0265902468824876E-5);
  const vec3  MieConst = vec3(1.8399918514433978E14,2.7798023919660528E14,4.0790479543861094E14);
  const float rayleighZenith = 8.4E3;
  const float mieZenith = 1.25E3;
  const float cutoff = 1.6110731556870734;
  const float steepness = 1.5;
  const float sunAngularDiameterCos = 0.999956676946448;
  float sunIntensity(float c){ c = clamp(c,-1.0,1.0);
    return 1000.0*max(0.0, 1.0 - exp(-((cutoff - acos(c))/steepness))); }
  float rayleighPhase(float c){ return (3.0/(16.0*PI))*(1.0 + c*c); }
  float hgPhase(float c,float g){ float g2=g*g;
    return (1.0/(4.0*PI))*((1.0-g2)/pow(max(1e-4,1.0-2.0*g*c+g2),1.5)); }
  float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
  float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float a=0.5,s=0.0; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=0.5; } return s; }
  void main(){
    vec3 dir = normalize(vDir);
    vec3 sun = normalize(uSun);
    vec3 up  = vec3(0.0,1.0,0.0);
    float sunE = sunIntensity(dot(sun,up));
    float sunfade = 1.0 - clamp(1.0 - exp(sun.y*3.0), 0.0, 1.0);
    float rC = uRayleigh - (1.0*(1.0-sunfade));
    vec3 betaR = totalRayleigh * rC;
    vec3 betaM = 0.434 * ((0.2*uTurb)*10E-18) * MieConst * uMie * 60.0;
    float zen = acos(max(0.0, dot(up,dir)));
    float inv = 1.0/(cos(zen) + 0.15*pow(max(0.001, 93.885 - zen*180.0/PI), -1.253));
    vec3 Fex = exp(-(betaR*rayleighZenith*inv + betaM*mieZenith*inv));
    float cosT = dot(dir,sun);
    vec3 bRT = betaR * rayleighPhase(cosT*0.5+0.5);
    vec3 bMT = betaM * hgPhase(cosT, uMieG);
    vec3 Lin = pow(sunE*((bRT+bMT)/(betaR+betaM))*(1.0-Fex), vec3(1.5));
    Lin *= mix(vec3(1.0), pow(sunE*((bRT+bMT)/(betaR+betaM))*Fex, vec3(0.5)),
               clamp(pow(1.0-dot(up,sun),5.0),0.0,1.0));

    float disk = smoothstep(sunAngularDiameterCos, sunAngularDiameterCos+0.00004, cosT);
    L0 += sunE*7200.0*Fex*disk;
    vec3 col = (Lin + L0) * 0.035;
    // night floor + stars
    float night = clamp(-sun.y*3.0, 0.0, 1.0);
    col += vec3(0.004,0.007,0.016)*night*3.0;
    if(night > 0.02 && dir.y > 0.0){
      float st = hash(floor(dir.xz*420.0/max(0.12,dir.y)));
      col += vec3(step(0.9975, st))*night*0.9*smoothstep(0.0,0.25,dir.y);
    }
    // cloud deck
    if(uClouds > 0.004 && dir.y > 0.005){
      vec2 cp = dir.xz/max(0.045, dir.y) * 0.55 + vec2(uTime*uCloudSpeed, uTime*uCloudSpeed*0.6);
      float n = fbm(cp*0.9);
      float n2 = fbm(cp*2.4 + 11.0);
      float cover = smoothstep(1.0-uClouds*0.92, 1.02-uClouds*0.42, n*0.75+n2*0.35);
      float shade = clamp(n2*0.7+0.35, 0.0, 1.0);
      float sunGlow = pow(max(0.0,cosT), 12.0);
      vec3 lit = mix(vec3(0.30,0.34,0.42), vec3(1.25,1.16,1.02), shade) * (0.35+0.85*max(0.05,sun.y+0.15));
      lit += vec3(1.4,0.85,0.5)*sunGlow*(1.0-sun.y)*0.9;
      float fadeH = smoothstep(0.0, 0.16, dir.y);
      col = mix(col, lit*0.45, cover*fadeH*0.92);
    }
    // horizon haze
    col = mix(col, col*vec3(1.05,1.0,0.94) + vec3(0.012,0.013,0.016),
              uHaze*pow(1.0-clamp(dir.y*2.6,0.0,1.0), 3.0));
    gl_FragColor = vec4(max(col,0.0)*uSkyI, 1.0);
  }`

fragmentShader:`
  varying vec2 vUv; uniform sampler2D tDepth; uniform mat4 uProjInv,uProj;
  uniform vec2 uRes; uniform float uRadius,uBias,uSeed,uNear,uFar;
  vec3 viewPos(vec2 uv){ float d = texture2D(tDepth,uv).x;
    vec4 c = uProjInv*vec4(uv*2.0-1.0, d*2.0-1.0, 1.0); return c.xyz/c.w; }
  float hash(vec2 p){ return fract(sin(dot(p,vec2(41.7,289.3)))*43758.5453+uSeed); }
  void main(){
    float d = texture2D(tDepth,vUv).x;
    if(d >= 0.9999){ gl_FragColor = vec4(1.0); return; }
    vec3 p = viewPos(vUv);
    vec3 n = normalize(cross(dFdx(p), dFdy(p)));
    float ang = hash(vUv*uRes)*6.2831853;
    float occ = 0.0;
    for(int i=0;i<12;i++){
      float fi = float(i);
      float r = uRadius*sqrt((fi+0.5+hash(vUv*7.1+fi))/12.0);
      float a = ang + fi*2.39996;
      vec3 dir = vec3(cos(a)*r, sin(a)*r, 0.0);
      vec3 t = normalize(abs(n.z)<0.9 ? cross(n,vec3(0,0,1)) : cross(n,vec3(1,0,0)));
      vec3 b = cross(n,t);

      if(suv.x<0.0||suv.x>1.0||suv.y<0.0||suv.y>1.0) continue;
      float sd = viewPos(suv).z;
      float diff = sd - sp.z;
      float range = smoothstep(0.0, 1.0, uRadius/max(0.0001, abs(p.z - sd)));

/* ── bloom chain ───────────────────────────────────────────────── */
const preUni = { tIn:{ value:null }, uThresh:{ value:1.15 }, uKnee:{ value:0.6 }, uExp:{ value:1 } };
const preMat = new THREE.ShaderMaterial({ uniforms:preUni, vertexShader:VERT, depthTest:false, depthWrite:false,
fragmentShader:`
  varying vec2 vUv; uniform sampler2D tIn; uniform float uThresh,uKnee,uExp;
  void main(){ vec3 c = texture2D(tIn,vUv).rgb*uExp;
    float l = max(c.r,max(c.g,c.b));

const dsUni = { tIn:{ value:null }, uTexel:{ value:new THREE.Vector2() } };

  varying vec2 vUv; uniform sampler2D tIn; uniform vec2 uTexel;
  void main(){ vec2 t = uTexel;

    c += (texture2D(tIn,vUv+vec2( t.x, t.y)).rgb + texture2D(tIn,vUv+vec2(-t.x, t.y)).rgb

    c += (texture2D(tIn,vUv+vec2(2.0*t.x,0.0)).rgb + texture2D(tIn,vUv+vec2(-2.0*t.x,0.0)).rgb
        + texture2D(tIn,vUv+vec2(0.0,2.0*t.y)).rgb + texture2D(tIn,vUv+vec2(0.0,-2.0*t.y)).rgb)*0.0625;

const usUni = { tIn:{ value:null }, tAdd:{ value:null }, uTexel:{ value:new THREE.Vector2() }, uScale:{ value:1 } };
const usMat = new THREE.ShaderMaterial({ uniforms:usUni, vertexShader:VERT, depthTest:false, depthWrite:false,
fragmentShader:`
  varying vec2 vUv; uniform sampler2D tIn,tAdd; uniform vec2 uTexel; uniform float uScale;
  void main(){ vec2 t = uTexel;
    vec3 c = texture2D(tIn,vUv).rgb*4.0;
    c += (texture2D(tIn,vUv+vec2(t.x,0.0)).rgb + texture2D(tIn,vUv-vec2(t.x,0.0)).rgb
        + texture2D(tIn,vUv+vec2(0.0,t.y)).rgb + texture2D(tIn,vUv-vec2(0.0,t.y)).rgb)*2.0;

/* ── composite / grade / tonemap ───────────────────────────────── */
const cUni = {
  tColor:{value:null}, tBloom:{value:null}, tCurve:{value:null},
  uExposure:{value:1}, uWB:{value:new THREE.Vector2(0,0)}, uContrast:{value:1}, uSat:{value:1},
  uTone:{value:0}, uBloom:{value:.35}, uDirt:{value:.18}, uHal:{value:.12},
  uRays:{value:.22}, uSunUV:{value:new THREE.Vector3(0.5,0.5,0)},
  uVig:{value:.28}, uGrain:{value:.045}, uChroma:{value:.22}, uSharp:{value:.35},
  uLift:{value:new THREE.Vector3()}, uGamma:{value:new THREE.Vector3()}, uGain:{value:new THREE.Vector3()},
  uFalse:{value:0}, uTexel:{value:new THREE.Vector2()}, uTime:{value:0}, uCurveOn:{value:1}

const cMat = new THREE.ShaderMaterial({ uniforms:cUni, vertexShader:VERT, depthTest:false, depthWrite:false,
fragmentShader:`
varying vec2 vUv;
uniform sampler2D tColor,tBloom,tCurve;
uniform vec2 uWB,uTexel; uniform vec3 uSunUV,uLift,uGamma,uGain;
uniform float uExposure,uContrast,uSat,uTone,uBloom,uDirt,uHal,uRays,uVig,uGrain,uChroma,uSharp,uFalse,uTime,uCurveOn;
const vec3 LUMA = vec3(0.2126,0.7152,0.0722);

vec3 aces(vec3 x){ const float a=2.51,b=0.03,c=2.43,d=0.59,e=0.14;
  return clamp((x*(a*x+b))/(x*(c*x+d)+e),0.0,1.0); }
vec3 reinhardFilm(vec3 x){ x = max(vec3(0.0), x-0.004);
  return (x*(6.2*x+0.5))/(x*(6.2*x+1.7)+0.06); }
vec3 agxCurve(vec3 v){ vec3 x=v, x2=x*x, x4=x2*x2;
  return 15.5*x4*x2 - 40.14*x4*x + 31.96*x4 - 6.868*x2*x + 0.4298*x2 + 0.1191*x - 0.00232; }
vec3 agx(vec3 c){
  mat3 M = mat3(0.842479062253094,0.0423282422610123,0.0423756549057051,
                0.0784335999999992,0.878468636469772,0.0784336,
                0.0792237451477643,0.0791661274605434,0.879142973793104);
  mat3 Mi = mat3(1.19687900512017,-0.0528968517574562,-0.0529716355144438,
                -0.0980208811401368,1.15190312990417,-0.0980434501171241,
                -0.0990297440797205,-0.0989611768448433,1.15107367264116);
  c = M*max(c,vec3(0.0));
  c = clamp(log2(max(c,vec3(1e-10))), -12.47393, 4.026069);
  c = (c + 12.47393)/(4.026069 + 12.47393);
  c = agxCurve(c);
  c = Mi*c;
  return clamp(pow(max(c,vec3(0.0)), vec3(1.0/1.05)), 0.0, 1.0);
}
vec3 whiteBalance(vec3 c, float t, float ti){
  vec3 g = vec3(1.0 + t*0.32 + ti*0.06, 1.0 - abs(t)*0.045 + ti*0.10, 1.0 - t*0.30 - ti*0.10);
  return c*g;
}
vec3 falseColor(float l){
  if(l < 0.02) return vec3(0.10,0.10,0.35);
  if(l < 0.08) return vec3(0.20,0.30,0.85);
  if(l < 0.20) return vec3(0.10,0.65,0.75);
  if(l < 0.38) return vec3(0.15,0.75,0.25);
  if(l < 0.52) return vec3(0.65,0.85,0.20);
  if(l < 0.72) return vec3(0.95,0.80,0.15);
  if(l < 0.90) return vec3(0.98,0.50,0.10);
  if(l < 0.985) return vec3(0.95,0.20,0.12);
  return vec3(1.0,0.10,0.75);
}
float hash21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

void main(){
  vec2 uv = vUv;
  vec2 d = uv - 0.5;
  float r2 = dot(d,d);
  vec3 col;
  if(uChroma > 0.0005){
    float k = uChroma*0.006*r2*4.0;
    col.r = texture2D(tColor, uv - d*k).r;
    col.g = texture2D(tColor, uv).g;
    col.b = texture2D(tColor, uv + d*k).b;
  } else col = texture2D(tColor, uv).rgb;

  if(uSharp > 0.001){
    vec3 n = texture2D(tColor, uv+vec2(uTexel.x,0.0)).rgb + texture2D(tColor, uv-vec2(uTexel.x,0.0)).rgb
           + texture2D(tColor, uv+vec2(0.0,uTexel.y)).rgb + texture2D(tColor, uv-vec2(0.0,uTexel.y)).rgb;
    col += (col - n*0.25)*uSharp*0.9;
    col = max(col, vec3(0.0));
  }

  col *= uExposure;

  vec3 bl = texture2D(tBloom, uv).rgb * uExposure;
  if(uRays > 0.001 && uSunUV.z > 0.5){
    vec3 acc = vec3(0.0);
    vec2 dir = (uSunUV.xy - uv);
    for(int i=0;i<12;i++){
      float f = float(i)/12.0;
      acc += texture2D(tBloom, uv + dir*f*0.92).rgb * (1.0-f);
    }
    col += acc/12.0*uRays*1.9*uExposure;
  }
  if(uBloom > 0.0005){
    float dirt = 1.0 + uDirt*(hash21(floor(uv*vec2(90.0,50.0)))*1.7 + pow(r2,0.6)*2.0);
    col += bl*uBloom*dirt;
  }
  if(uHal > 0.0005) col += bl*vec3(1.0,0.34,0.16)*uHal*1.4;

  col = whiteBalance(col, uWB.x, uWB.y);

  vec3 t;
  if(uTone < 0.5)      t = aces(col);
  else if(uTone < 1.5) t = reinhardFilm(col);
  else if(uTone < 2.5) t = agx(col);
  else                 t = clamp(col, 0.0, 1.0);

  if(uFalse > 0.5){
    gl_FragColor = vec4(falseColor(dot(t,LUMA)), 1.0); return;
  }

  vec3 slope = vec3(1.0) + uGain;
  vec3 power = exp2(-uGamma);
  t = pow(clamp(t*slope + uLift, 0.0, 1.0), power);
  t = clamp((t - 0.435)*uContrast + 0.435, 0.0, 1.0);
  float l = dot(t, LUMA);
  t = clamp(mix(vec3(l), t, uSat), 0.0, 1.0);

  if(uCurveOn > 0.5){
    t = vec3(texture2D(tCurve, vec2(t.r,0.5)).r,
             texture2D(tCurve, vec2(t.g,0.5)).r,
             texture2D(tCurve, vec2(t.b,0.5)).r);
  }

  t *= mix(1.0, clamp(1.0 - r2*1.9, 0.0, 1.0), uVig);
  if(uGrain > 0.0005){
    float g = hash21(uv*vec2(1024.0,768.0) + uTime*13.7) - 0.5;
    t += g*uGrain*(1.0 - 0.65*dot(t,LUMA));
  }
  t = clamp(t, 0.0, 1.0);
  // linear -> sRGB
  vec3 s = mix(t*12.92, 1.055*pow(max(t,vec3(1e-5)), vec3(1.0/2.4)) - 0.055, step(0.0031308, t));
  s += (hash21(uv*1023.0+uTime)-0.5)/255.0;
  gl_FragColor = vec4(s, 1.0);
}`});

/* curve LUT texture */
const curveData = new Uint8Array(256 * 4);
const curveTex = new THREE.DataTexture(curveData, 256, 1, THREE.RGBAFormat);
curveTex.needsUpdate = true; curveTex.minFilter = curveTex.magFilter = THREE.LinearFilter;
cUni.tCurve.value = curveTex;
function rebuildCurve(){
  const pts = P.post.curve.slice().sort((a, b) => a[0] - b[0]);
  for (let i = 0; i < 256; i++){
    const x = i / 255; let y = x;
    for (let k = 0; k < pts.length - 1; k++){
      const [x0, y0] = pts[k], [x1, y1] = pts[k + 1];
      if (x >= x0 && x <= x1){
        const t = (x1 - x0) < 1e-6 ? 0 : (x - x0) / (x1 - x0);
        const s = t * t * (3 - 2 * t);           // smoothstep segment
        y = lerp(y0, y1, s); break;
      }
      if (x < pts[0][0]) y = pts[0][1];
      if (x > pts[pts.length - 1][0]) y = pts[pts.length - 1][1];
    }
    const v = clamp(Math.round(y * 255), 0, 255);
    curveData[i * 4] = curveData[i * 4 + 1] = curveData[i * 4 + 2] = v; curveData[i * 4 + 3] = 255;
  }
  curveTex.needsUpdate = true;
}

/* ── pipeline driver ───────────────────────────────────────────── */
let sample = 0, accumulating = true, needsReset = true;
const jitterMx = new THREE.Matrix4();
const camBase = { pos:new THREE.Vector3(), quat:new THREE.Quaternion() };

function resetAccum(){ sample = 0; needsReset = true; }

function targetSamples(){
  const m = P.render.mode;
  if (m === 'realtime')  return 1;
  if (m === 'hybrid')    return Math.min(P.render.maxSamples, 96);
  if (m === 'pathtrace') return Math.max(128, P.render.maxSamples);
  if (m === 'ultra')     return Math.max(320, P.render.maxSamples);
  return P.render.maxSamples;
}

function applyJitter(idx){
  camera.updateMatrixWorld();
  camBase.pos.copy(camera.position); camBase.quat.copy(camera.quaternion);
  if (idx === 0) return;
  // sub-pixel AA jitter
  const jx = (halton(idx, 2) - 0.5) * 2 / RW;
  const jy = (halton(idx, 3) - 0.5) * 2 / RH;
  camera.projectionMatrix.elements[8]  += jx;
  camera.projectionMatrix.elements[9]  += jy;
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
  // physical depth of field: sample the aperture disc, re-aim at the focal plane
  const fstop = P.cam.aperture;
  if (fstop < 22 && P.render.mode !== 'realtime'){
    const fl = P.cam.focal / 1000;
    const radius = (fl / fstop) * 0.5 * 8;       // metres, exaggerated for viewport legibility
    const a = halton(idx, 5) * Math.PI * 2, rr = Math.sqrt(halton(idx, 7)) * radius;
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camBase.quat);
    const up    = new THREE.Vector3(0, 1, 0).applyQuaternion(camBase.quat);
    const fwd   = new THREE.Vector3(0, 0, -1).applyQuaternion(camBase.quat);
    const focal = camBase.pos.clone().addScaledVector(fwd, P.cam.focusDist);
    camera.position.copy(camBase.pos).addScaledVector(right, Math.cos(a) * rr).addScaledVector(up, Math.sin(a) * rr);
    camera.lookAt(focal);
    camera.updateMatrixWorld();
  }
}
function unJitter(){
  camera.position.copy(camBase.pos); camera.quaternion.copy(camBase.quat);
  camera.updateProjectionMatrix(); camera.updateMatrixWorld();
}

function renderFrame(dt){
  const maxS = targetSamples();
  const drawing = sample < maxS;
  if (drawing){
    jitterSun(sample);
    applyJitter(sample);
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    renderer.render(scene, camera);
    unJitter();

    if (P.render.aoOn){
      aoUni.uProjInv.value.copy(camera.projectionMatrixInverse);
      aoUni.uProj.value.copy(camera.projectionMatrix);
      aoUni.uRadius.value = P.render.aoRadius;
      aoUni.uSeed.value = sample * 0.618;
      blit(aoMat, aoRT);
    }
    accUni.tPrev.value = accA.texture;
    accUni.tNew.value  = sceneRT.texture;
    accUni.tAO.value   = aoRT.texture;
    accUni.uUseAO.value = P.render.aoOn ? 1 : 0;
    accUni.uAO.value = P.render.aoStrength;
    accUni.uMix.value = needsReset ? 1 : 1 / (sample + 1);
    blit(accMat, accB);
    const t = accA; accA = accB; accB = t;
    needsReset = false;
    sample++;
  }

  // bloom
  const bloomOn = P.post.bloom > 0.0005 || P.post.rays > 0.0005 || P.post.halation > 0.0005;
  if (bloomOn){
    preUni.tIn.value = accA.texture;
    preUni.uThresh.value = P.post.bloomThreshold;
    preUni.uExp.value = Math.pow(2, P.post.exposure);
    blit(preMat, bloomRT[0]);
    for (let i = 1; i < 5; i++){
      dsUni.tIn.value = bloomRT[i - 1].texture;
      dsUni.uTexel.value.set(1 / bloomRT[i - 1].width, 1 / bloomRT[i - 1].height);
      blit(dsMat, bloomRT[i]);
    }
    for (let i = 3; i >= 0; i--){
      usUni.tIn.value  = bloomRT[i + 1].texture;
      usUni.tAdd.value = bloomRT[i].texture;
      usUni.uTexel.value.set(1 / bloomRT[i + 1].width, 1 / bloomRT[i + 1].height);
      usUni.uScale.value = 0.85;
      const tmp = bloomTmp(i);
      blit(usMat, tmp);
      const prev = bloomRT[i]; bloomRT[i] = tmp; bloomTmpRT[i] = prev;
    }
  }
  cUni.tColor.value = accA.texture;
  cUni.tBloom.value = bloomOn ? bloomRT[0].texture : blackTex;
  cUni.uTexel.value.set(1 / RW, 1 / RH);
  cUni.uTime.value = performance.now() * 0.001;
  blit(cMat, null);
  return drawing;
}

/* upsample needs a scratch target per level (cannot read+write same RT) */
let bloomTmpRT = [];
function bloomTmp(i){
  if (!bloomTmpRT[i] || bloomTmpRT[i].width !== bloomRT[i].width
      || bloomTmpRT[i].height !== bloomRT[i].height){
    if (bloomTmpRT[i]) bloomTmpRT[i].dispose();
    bloomTmpRT[i] = RT(bloomRT[i].width, bloomRT[i].height, false);
  }
  return bloomTmpRT[i];
}
const blackTex = (() => { const d = new Uint8Array([0,0,0,255]);
  const t = new THREE.DataTexture(d, 1, 1); t.needsUpdate = true; return t; })();

function kelvin(k){
  k = clamp(k, 1000, 20000) / 100; let r, g, b;
  if (k <= 66){ r = 255; g = 99.47 * Math.log(k) - 161.12; }
  else { r = 329.7 * Math.pow(k - 60, -0.1332); g = 288.12 * Math.pow(k - 60, -0.0755); }
  if (k >= 66) b = 255; else if (k <= 19) b = 0; else b = 138.52 * Math.log(k - 10) - 305.04;
  return new THREE.Color(clamp(r,0,255)/255, clamp(g,0,255)/255, clamp(b,0,255)/255).convertSRGBToLinear();
}

const WEATHER = {
  clear:    { clouds:0.10, haze:0.22, fog:0.0022, wet:0.00, turb:2.2, mul:1.00 },
  partly:   { clouds:0.42, haze:0.32, fog:0.0032, wet:0.00, turb:2.8, mul:0.92 },
  overcast: { clouds:0.95, haze:0.62, fog:0.0075, wet:0.10, turb:4.6, mul:0.42 },
  rain:     { clouds:0.92, haze:0.70, fog:0.0110, wet:0.85, turb:5.2, mul:0.30 },
  storm:    { clouds:1.00, haze:0.82, fog:0.0160, wet:1.00, turb:6.4, mul:0.20 },
  fog:      { clouds:0.55, haze:0.95, fog:0.0290, wet:0.35, turb:5.8, mul:0.45 },

function updateSun(){
  const e = P.env;
  const d = new Date(2025, e.month - 1, e.day, Math.floor(e.hour), Math.round((e.hour % 1) * 60), 0);
  const s = sunPosition(e.lat, e.lon, d, e.tz);
  const az = s.azimuth + e.north * DEG;
  sunDir = sunVector(az, s.altitude);
  return s;
}

function applyEnvironment(regen){
  const e = P.env, w = WEATHER[e.weather] || WEATHER.clear;
  const s = updateSun();

  skyUni.uSun.value.copy(sunDir);
  skyUni.uTurb.value   = e.turbidity * (0.6 + w.turb * 0.22);
  skyUni.uClouds.value = clamp(e.clouds * 0.45 + w.clouds * 0.7, 0, 1);
  skyUni.uHaze.value   = clamp(e.haze * 0.5 + w.haze * 0.6, 0, 1.2);
  skyUni.uCloudSpeed.value = e.cloudSpeed;
  skyUni.uSkyI.value   = e.skyIntensity;

  const alt = sunDir.y;
  const day = clamp((alt + 0.055) / 0.20, 0, 1);
  const warm = clamp(1 - alt * 2.6, 0, 1);
  const temp = lerp(e.sunTemp, 2050, warm * warm);
  sunLight.color.copy(kelvin(temp));
  sunLight.intensity = e.sunIntensity * day * w.mul;
  sunLight.position.copy(sunDir).multiplyScalar(320);
  sunLight.visible = sunLight.intensity > 0.002;
  const R = P.scene.preset === 'tower' ? 130 : 82;
  const sc = sunLight.shadow.camera;
  sc.left = -R; sc.right = R; sc.top = R; sc.bottom = -R; sc.far = 900; sc.updateProjectionMatrix();
  if (sunLight.shadow.mapSize.x !== P.render.shadowRes){
    sunLight.shadow.mapSize.set(P.render.shadowRes, P.render.shadowRes);
    if (sunLight.shadow.map){ sunLight.shadow.map.dispose(); sunLight.shadow.map = null; }
  }

  const night = clamp(-alt * 6, 0, 1);
  moonLight.intensity = night * 0.14;
  moonLight.position.set(-sunDir.x * 300, Math.abs(sunDir.y) * 260 + 90, -sunDir.z * 300);
  bounce.intensity = 0.12;
  bounce.groundColor.copy(kelvin(4200)).multiplyScalar(e.groundAlbedo * 4);

  const horizon = new THREE.Color().setHSL(0.58 - warm * 0.10, 0.22 + warm * 0.28, clamp(0.06 + day * 0.42, 0.03, 0.62));
  const fogD = Math.max(e.fogDensity, w.fog);
  scene.fog = fogD > 0.0002 ? new THREE.FogExp2(horizon.getHex(), fogD) : null;

  setWetness(Math.max(e.wetness, w.wet));
  setWeatherFX(e.weather);

  if (regen !== false){ envDirty = true; }
  $('#stSun').textContent = 'sun ' + fmt(s.altitude / DEG, 1) + '° alt / ' + fmt(((s.azimuth / DEG) + e.north) % 360, 0) + '° az';
  resetAccum();
}

function regenEnvMap(){

/* wetness — darkens + smooths every registered PBR surface */
const wetRegistry = [];
function registerMat(m){ if (!m || m._reg) return m; m._reg = true;
  m.userData.baseRough = m.roughness; m.userData.baseColor = m.color ? m.color.clone() : null;
  wetRegistry.push(m); return m; }
function setWetness(v){
  for (const m of wetRegistry){
    if (m.userData.baseRough == null) continue;
    if (m.userData.noWet) continue;
    m.roughness = clamp(lerp(m.userData.baseRough, m.userData.baseRough * 0.18 + 0.02, v), 0.01, 1);
    if (m.userData.baseColor) m.color.copy(m.userData.baseColor).multiplyScalar(lerp(1, 0.66, v));
    m.needsUpdate = false;
  }
}

/* precipitation */
let precip = null;
function makePrecip(kind){
  if (precip){ scene.remove(precip); precip.geometry.dispose(); precip.material.dispose(); precip = null; }
  if (kind !== 'rain' && kind !== 'storm' && kind !== 'snow') return;
  const snow = kind === 'snow';
  const N = snow ? 4200 : 6000;
  const pos = new Float32Array(N * 6), off = new Float32Array(N * 2), rnd = new Float32Array(N * 2);
  const R = mulberry(99);
  for (let i = 0; i < N; i++){
    const x = (R() - 0.5) * 190, y = R() * 90, z = (R() - 0.5) * 190;
    const len = snow ? 0.10 : (2.2 + R() * 2.4);
    pos.set([x, y, z, x, y - len, z], i * 6);
    off[i * 2] = R(); off[i * 2 + 1] = R();
    rnd[i * 2] = R(); rnd[i * 2 + 1] = R();
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const a = new Float32Array(N * 2 * 2), b = new Float32Array(N * 2 * 2);
  for (let i = 0; i < N; i++){ a[i*4]=off[i*2]; a[i*4+1]=off[i*2+1]; a[i*4+2]=off[i*2]; a[i*4+3]=off[i*2+1];
    b[i*4]=rnd[i*2]; b[i*4+1]=rnd[i*2+1]; b[i*4+2]=rnd[i*2]; b[i*4+3]=rnd[i*2+1]; }
  g.setAttribute('aOff', new THREE.BufferAttribute(a, 2));
  g.setAttribute('aRnd', new THREE.BufferAttribute(b, 2));
  const mat = new THREE.ShaderMaterial({ transparent:true, depthWrite:false, fog:false,
    blending:snow ? THREE.NormalBlending : THREE.AdditiveBlending,
    uniforms:{ uTime:{value:0}, uCam:{value:new THREE.Vector3()}, uSnow:{value:snow?1:0},
               uSpeed:{value:snow?3.2:52}, uOpacity:{value:snow?0.9:0.34} },
    vertexShader:`attribute vec2 aOff; attribute vec2 aRnd; uniform float uTime,uSpeed,uSnow;
      uniform vec3 uCam; varying float vA;
      void main(){ vec3 p = position;
        float fall = mod(p.y - uTime*uSpeed*(0.7+aRnd.x*0.6), 90.0);
        p.y = fall;
        if(uSnow > 0.5){ p.x += sin(uTime*0.7 + aRnd.y*30.0)*1.9; p.z += cos(uTime*0.55 + aRnd.x*22.0)*1.9; }
        else { p.x += sin(uTime*0.3 + aRnd.y*12.0)*0.8; }
        p.x += floor(uCam.x/190.0+0.5)*190.0; p.z += floor(uCam.z/190.0+0.5)*190.0;
        vA = 0.35 + aRnd.y*0.65;
        gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.0); }`,
    fragmentShader:`varying float vA; uniform float uOpacity,uSnow;
      void main(){ gl_FragColor = vec4(vec3(uSnow>0.5?1.0:0.75), vA*uOpacity); }` });
  precip = new THREE.LineSegments(g, mat);
  precip.frustumCulled = false; scene.add(precip);
}
function setWeatherFX(kind){
  const want = (kind === 'rain' || kind === 'storm') ? 'rain' : (kind === 'snow' ? 'snow' : 'none');
  if (precip && precip.userData.kind === want) return;
  makePrecip(want === 'none' ? '' : want);
  if (precip) precip.userData.kind = want;
}

/* artificial lighting */
const artificial = new THREE.Group(); scene.add(artificial);
function updateArtificialLights(night){
  const on = clamp(night * 1.4 + (P.env.weather === 'storm' ? 0.4 : 0), 0, 1);
  artificial.traverse(o => {
    if (o.isLight){
      const base = o.userData.kind === 'street' ? P.lights.streetIntensity : P.lights.interiorIntensity;
      const en   = o.userData.kind === 'street' ? P.lights.street : P.lights.interior;
      o.intensity = en ? base * o.userData.mul * (0.16 + on * 1.5) : 0;
      o.color.copy(kelvin(o.userData.kind === 'street' ? P.lights.streetTemp : P.lights.interiorTemp));
    }
    if (o.isMesh && o.material && o.material.emissive && o.userData.emissive){
      const en = o.userData.kind === 'street' ? P.lights.street : P.lights.interior;
      o.material.emissiveIntensity = en ? o.userData.emissive * (0.05 + on * 2.4) : 0;
      o.material.emissive.copy(kelvin(o.userData.kind === 'street' ? P.lights.streetTemp : P.lights.interiorTemp));
    }
  });
}

/* soft-shadow sampling: perturb the sun within its angular diameter */
const sunBase = new THREE.Vector3();
function jitterSun(idx){
  if (idx === 0){ sunBase.copy(sunLight.position); return; }
  if (P.render.mode === 'realtime') return;
  const soft = 0.0047 * (1 + P.env.sunSoftness * 34);
  const a = halton(idx, 11) * Math.PI * 2, r = Math.sqrt(halton(idx, 13)) * soft;
  const v = sunBase.clone().normalize();
  const t = new THREE.Vector3(0, 1, 0).cross(v).normalize();
  const b = v.clone().cross(t);
  v.addScaledVector(t, Math.cos(a) * r).addScaledVector(b, Math.sin(a) * r).normalize();
  sunLight.position.copy(v.multiplyScalar(sunBase.length()));
}

   =================================================================== */
const MATLIB = {

  terrazzo:   { color:'#cfc9bf', rough:0.30, metal:0.0, pattern:'speck', scale:6.0, bump:0.14, tile:[4,4] },
  marble:     { color:'#efeeea', rough:0.16, metal:0.0, pattern:'vein',  scale:2.2, bump:0.10, tile:[2,2] },

  steel:      { color:'#b9bec4', rough:0.28, metal:1.0, pattern:'brush', scale:8.0, bump:0.10, tile:[2,2] },
  aluminium:  { color:'#cbd0d5', rough:0.34, metal:1.0, pattern:'brush', scale:8.0, bump:0.08, tile:[2,2] },
  corten:     { color:'#8a4a2c', rough:0.70, metal:0.55,pattern:'stone', scale:4.4, bump:0.55, tile:[3,3] },
  darkMetal:  { color:'#33383d', rough:0.42, metal:0.85,pattern:'none',  scale:5.0, bump:0.10, tile:[2,2] },
  asphalt:    { color:'#3b3d40', rough:0.88, metal:0.0, pattern:'speck', scale:9.0, bump:0.6,  tile:[24,24] },
  paving:     { color:'#8d8a85', rough:0.78, metal:0.0, pattern:'panel', scale:4.0, bump:0.55, tile:[16,16] },
  grass:      { color:'#4d6b34', rough:0.92, metal:0.0, pattern:'speck', scale:14.0,bump:0.5,  tile:[40,40] },
  soil:       { color:'#4a3f33', rough:0.94, metal:0.0, pattern:'speck', scale:10.0,bump:0.7,  tile:[20,20] },
  fabric:     { color:'#8b8577', rough:0.95, metal:0.0, pattern:'weave', scale:9.0, bump:0.35, tile:[3,3] }
};

/* value-noise fbm on the CPU for texture synthesis */
function texNoise(seed){
  const R = mulberry(seed), G = new Float32Array(256 * 256);
  for (let i = 0; i < G.length; i++) G[i] = R();
  const at = (x, y) => G[((y & 255) << 8) + (x & 255)];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    let fx = x - xi, fy = y - yi;
    fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
    return lerp(lerp(at(xi, yi), at(xi + 1, yi), fx), lerp(at(xi, yi + 1), at(xi + 1, yi + 1), fx), fy);
  };
}
const texCache = new Map();
function procTex(key){
  if (texCache.has(key)) return texCache.get(key);
  const c = MATLIB[key]; const S = 512;
  const n1 = texNoise(11 + key.length * 7), n2 = texNoise(97 + key.length * 3);
  const fbm = (x, y, o) => { let a = 0.5, s = 0, f = 1;
    for (let i = 0; i < (o || 4); i++){ s += a * n1(x * f, y * f); f *= 2.07; a *= 0.5; } return s; };
  const H = new Float32Array(S * S);
  const V = new Float32Array(S * S);      // colour variance
  const sc = c.scale;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const u = x / S * sc, v = y / S * sc; let h = fbm(u * 3, v * 3, 5), val = fbm(u * 1.4 + 40, v * 1.4, 3);
    switch (c.pattern){
      case 'brick': { const rowH = S / 12; const row = Math.floor(y / rowH);
        const off = (row % 2) * 0.5; const colW = S / 6;
        const bx = ((x / colW) + off) % 1, by = (y / rowH) % 1;
        const m = Math.min(Math.min(bx, 1 - bx), Math.min(by, 1 - by));
        h = h * 0.35 + (m < 0.045 ? 0.0 : 0.85);
        val = val * 0.5 + ((row * 7 + Math.floor(x / colW + off)) % 5) * 0.09; break; }
      case 'plank': { const pw = S / 5; const p = Math.floor(x / pw);
        const px = (x / pw) % 1;
        h = h * 0.4 + (Math.min(px, 1 - px) < 0.02 ? 0.05 : 0.8);
        const grain = n2(y / S * 90 + p * 33, p * 5) * 0.5 + fbm(u * 0.3, v * 14, 3) * 0.5;
        h = h * 0.6 + grain * 0.4; val = grain * 0.7 + (p % 3) * 0.06; break; }
      case 'panel': { const g = S / 4;
        const gx = (x / g) % 1, gy = (y / g) % 1;
        const m = Math.min(Math.min(gx, 1 - gx), Math.min(gy, 1 - gy));
        h = h * 0.55 + (m < 0.012 ? 0.1 : 0.85);
        val = val * 0.6 + ((Math.floor(x / g) * 3 + Math.floor(y / g)) % 4) * 0.05; break; }
      case 'speck': { const s2 = n2(x * 1.7, y * 1.7);
        h = h * 0.55 + (s2 > 0.86 ? 1.0 : s2 * 0.3); val = s2; break; }
      case 'stone': { h = fbm(u * 2, v * 2, 6); val = fbm(u * 0.8 + 9, v * 0.8, 3); break; }
      case 'vein':  { const w = fbm(u * 1.1, v * 1.1, 5);
        const veins = Math.abs(Math.sin((u * 2.2 + w * 2.6) * Math.PI * 1.4));
        h = 0.75 + veins * 0.1; val = Math.pow(1 - veins, 6); break; }
      case 'brush': { h = 0.5 + (n2(x * 0.35, y * 22) - 0.5) * 0.6; val = h; break; }
      case 'weave': { const wv = (Math.sin(x * 1.15) * Math.sin(y * 1.15)) * 0.5 + 0.5;
        h = wv * 0.6 + fbm(u * 4, v * 4, 3) * 0.4; val = h; break; }
      default: { h = fbm(u * 2.2, v * 2.2, 5); val = fbm(u + 3, v + 3, 3); }
    }
    H[y * S + x] = h; V[y * S + x] = val;
  }
  const base = new THREE.Color(c.color);
  const mk = () => { const cv = document.createElement('canvas'); cv.width = cv.height = S;
    return { cv, ctx: cv.getContext('2d'), id: null }; };
  const A = mk(), Rg = mk(), N = mk();
  A.id = A.ctx.createImageData(S, S); Rg.id = Rg.ctx.createImageData(S, S); N.id = N.ctx.createImageData(S, S);
  const bump = c.bump;
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++){
    const i = y * S + x, o = i * 4;
    const h = H[i], v = V[i];
    const shade = 0.78 + h * 0.30 + (v - 0.5) * 0.22;
    A.id.data[o]     = clamp(base.r * 255 * shade, 0, 255);
    A.id.data[o + 1] = clamp(base.g * 255 * shade * (1 + (v - 0.5) * 0.04), 0, 255);
    A.id.data[o + 2] = clamp(base.b * 255 * shade * (1 - (v - 0.5) * 0.05), 0, 255);
    A.id.data[o + 3] = 255;
    const rr = clamp((c.rough + (h - 0.5) * 0.30 + (v - 0.5) * 0.12) * 255, 6, 255);
    Rg.id.data[o] = Rg.id.data[o + 1] = Rg.id.data[o + 2] = rr; Rg.id.data[o + 3] = 255;
    const hl = H[y * S + ((x + S - 1) % S)], hr = H[y * S + ((x + 1) % S)];
    const hu = H[((y + S - 1) % S) * S + x], hd = H[((y + 1) % S) * S + x];
    const dx = (hl - hr) * bump * 6, dy = (hu - hd) * bump * 6;
    const len = Math.hypot(dx, dy, 1);
    N.id.data[o]     = clamp((dx / len * 0.5 + 0.5) * 255, 0, 255);
    N.id.data[o + 1] = clamp((dy / len * 0.5 + 0.5) * 255, 0, 255);
    N.id.data[o + 2] = clamp((1 / len * 0.5 + 0.5) * 255, 0, 255);
    N.id.data[o + 3] = 255;
  }
  A.ctx.putImageData(A.id, 0, 0); Rg.ctx.putImageData(Rg.id, 0, 0); N.ctx.putImageData(N.id, 0, 0);
  const wrap = (cv, srgb) => { const t = new THREE.CanvasTexture(cv);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    if (srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  const out = { map:wrap(A.cv, true), roughnessMap:wrap(Rg.cv, false), normalMap:wrap(N.cv, false) };
  texCache.set(key, out); return out;
}

const matCache = new Map();
function mat(key, over){
  const id = key + JSON.stringify(over || {});
  if (matCache.has(id)) return matCache.get(id);
  let m;
  if (key === 'glass'){
    m = new THREE.MeshPhysicalMaterial({ color:new THREE.Color('#cfe0e6'), roughness:0.055, metalness:0.0,
      transparent:true, opacity:0.30, envMapIntensity:1.8, side:THREE.DoubleSide,
      clearcoat:1.0, clearcoatRoughness:0.02, depthWrite:false });
    m.userData.noWet = true;
  } else if (key === 'water'){
    m = new THREE.MeshPhysicalMaterial({ color:new THREE.Color('#12303a'), roughness:0.035, metalness:0.0,
      envMapIntensity:2.0, clearcoat:1.0, clearcoatRoughness:0.02 });
    m.userData.noWet = true;
  } else if (key === 'emissive'){
    m = new THREE.MeshStandardMaterial({ color:0x11151a, emissive:new THREE.Color('#ffd7a0'),
      emissiveIntensity:1.0, roughness:1.0, metalness:0 });
    m.userData.noWet = true;
  } else {
    const c = MATLIB[key] || MATLIB.concrete;
    const t = procTex(MATLIB[key] ? key : 'concrete');
    m = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:c.rough, metalness:c.metal,
      map:t.map, roughnessMap:t.roughnessMap, normalMap:t.normalMap, envMapIntensity:1.0 });
    m.normalScale.set(1, 1);
    const rep = (over && over.tile) || c.tile;
    ['map','roughnessMap','normalMap'].forEach(k => { m[k] = m[k].clone(); m[k].needsUpdate = true;
      m[k].wrapS = m[k].wrapT = THREE.RepeatWrapping; m[k].repeat.set(rep[0], rep[1]); });
  }
  if (over) Object.keys(over).forEach(k => { if (k === 'tile') return;
    if (m[k] && m[k].isColor) m[k].set(over[k]); else m[k] = over[k]; });
  m.name = key;
  registerMat(m); matCache.set(id, m); return m;
}

/* ===================================================================
   4. SCENE ASSEMBLY — parametric architecture + scatter engine
   =================================================================== */
const ROOT = new THREE.Group(); ROOT.name = 'Project'; scene.add(ROOT);
const bounds = new THREE.Box3();
const SITE_R = 42;

const terrainNoise = texNoise(4242);
function terrainFbm(x, z){ let a = 0.5, s = 0, f = 0.012;
  for (let i = 0; i < 4; i++){ s += a * terrainNoise(x * f, z * f); f *= 2.1; a *= 0.5; } return s; }
function heightAt(x, z){
  const d = Math.hypot(x, z);
  const k = clamp((d - SITE_R) / 46, 0, 1);
  return (terrainFbm(x, z) - 0.5) * 6.5 * k * k;
}
function slopeAt(x, z){
  const e = 1.5;
  const dx = heightAt(x + e, z) - heightAt(x - e, z);
  const dz = heightAt(x, z + e) - heightAt(x, z - e);
  return Math.atan(Math.hypot(dx, dz) / (2 * e)) / DEG;
}

function disposeTree(o){
  o.traverse(n => { if (n.geometry) n.geometry.dispose();
    if (n.isInstancedMesh && n.instanceColor) n.instanceColor = null; });
}
function clearRoot(){ _glowShared = null; _glowContext = null;
  if (IMPORTS.parent === ROOT) ROOT.remove(IMPORTS);   // imported assets survive a rebuild
  while (ROOT.children.length){ const c = ROOT.children.pop(); disposeTree(c); }
  while (artificial.children.length){ const c = artificial.children.pop(); disposeTree(c); } }

function box(w, h, d, m, x, y, z, name){
  const g = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  g.position.set(x, y, z); g.castShadow = true; g.receiveShadow = true;
  if (name) g.name = name; return g;
}
function plane(w, h, m, name){
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
  p.castShadow = false; p.receiveShadow = true; if (name) p.name = name; return p;
}
function instanced(geo, material, mats, name, colors){
  const im = new THREE.InstancedMesh(geo, material, mats.length);
  const c = new THREE.Color();
  mats.forEach((m, i) => { im.setMatrixAt(i, m);
    if (colors){ c.set(colors[i]); im.setColorAt(i, c); } });
  im.instanceMatrix.needsUpdate = true;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  im.castShadow = im.receiveShadow = true; im.name = name || 'Instances';
  return im;
}
const M4 = (x, y, z, sx, sy, sz, ry) => new THREE.Matrix4().compose(
  new THREE.Vector3(x, y, z),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(0, ry || 0, 0)),
  new THREE.Vector3(sx == null ? 1 : sx, sy == null ? 1 : sy, sz == null ? 1 : sz));

let _glowShared = null, _glowContext = null;
function glowMaterial(kind){
  const ref = kind === 'context' ? _glowContext : _glowShared;
  if (ref) return ref;
  const m = mat('emissive').clone();
  m.side = THREE.DoubleSide; m.userData.noWet = true; registerMat(m);
  if (kind === 'context') _glowContext = m; else _glowShared = m;
  return m;
}
function glowPanel(w, h, x, y, z, ry, kind){
  const m = glowMaterial(kind === 'context' ? 'context' : 'interior');
  const p = plane(w, h, m, 'Interior glow');
  p.position.set(x, y, z); p.rotation.y = ry || 0;
  p.userData.emissive = 1.0; p.userData.kind = kind || 'interior';
  p.castShadow = false; p.receiveShadow = false;
  return p;
}

/* ── ground & site ─────────────────────────────────────────────── */
function buildGround(){
  const g = new THREE.PlaneGeometry(900, 900, 150, 150);
  const pos = g.attributes.position;
  for (let i = 0; i < pos.count; i++){
    const x = pos.getX(i), y = pos.getY(i);
    pos.setZ(i, heightAt(x, -y));
  }
  g.computeVertexNormals();
  const gm = new THREE.Mesh(g, mat(P.scene.groundMat === 'asphalt' ? 'grass' : P.scene.groundMat));
  gm.rotation.x = -Math.PI / 2; gm.receiveShadow = true; gm.name = 'Terrain';
  ROOT.add(gm);
  const pad = new THREE.Mesh(new THREE.CircleGeometry(SITE_R + 4, 64), mat('paving'));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.02; pad.receiveShadow = true; pad.name = 'Site paving';
  ROOT.add(pad);
}
function buildRoad(){
  const z = -(P.scene.depth / 2 + 20);
  const road = box(320, 0.12, 13, mat('asphalt', { tile:[40, 2] }), 0, 0.06, z, 'Roadway');
  const walk1 = box(320, 0.28, 3.4, mat('paving', { tile:[64, 1] }), 0, 0.14, z + 8.2, 'Sidewalk N');
  const walk2 = box(320, 0.28, 3.4, mat('paving', { tile:[64, 1] }), 0, 0.14, z - 8.2, 'Sidewalk S');
  ROOT.add(road, walk1, walk2);
  const dash = [], dg = new THREE.BoxGeometry(2.6, 0.02, 0.16);
  for (let x = -150; x <= 150; x += 7) dash.push(M4(x, 0.14, z, 1, 1, 1, 0));
  ROOT.add(instanced(dg, new THREE.MeshStandardMaterial({ color:0xe8e2d0, roughness:0.8 }), dash, 'Lane markings'));
  // street lighting
  const pole = new THREE.CylinderGeometry(0.09, 0.12, 8.4, 8);
  const arms = [];
  for (let x = -84; x <= 84; x += 28) arms.push(M4(x, 4.2, z + 7.4, 1, 1, 1, 0));
  artificial.add(instanced(pole, mat('darkMetal'), arms, 'Street poles'));
  arms.forEach((m, i) => {
    const p = new THREE.Vector3().setFromMatrixPosition(m);
    const head = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.18, 0.42), mat('emissive').clone());
    registerMat(head.material);
    head.position.set(p.x, 8.3, p.z - 0.6); head.userData.emissive = 2.2; head.userData.kind = 'street';
    artificial.add(head);
    if (i % 2 === 0){

/* ── curtain-wall helper ───────────────────────────────────────── */
function curtainWall(group, w, h, y, px, pz, ry, moduleW, opts){
  const o = opts || {};
  const cy = y + h / 2;
  const tx = Math.cos(ry), tz = -Math.sin(ry);       // wall tangent (local +X)
  const nx = Math.sin(ry), nz = Math.cos(ry);        // wall normal (local +Z)
  const glassMesh = plane(w, h, mat('glass'), 'Glazing');
  glassMesh.position.set(px, cy, pz); glassMesh.rotation.y = ry;
  glassMesh.castShadow = false; glassMesh.receiveShadow = false;
  group.add(glassMesh);
  const cols = Math.max(1, Math.round(w / moduleW));
  const mg = new THREE.BoxGeometry(0.09, h, 0.22), ms = [];
  for (let i = 0; i <= cols; i++){
    const t = -w / 2 + (w / cols) * i;
    ms.push(M4(px + t * tx, cy, pz + t * tz, 1, 1, 1, ry));
  }
  group.add(instanced(mg, mat('aluminium'), ms, 'Mullions'));
  const tg = new THREE.BoxGeometry(w, 0.11, 0.24);
  group.add(instanced(tg, mat('aluminium'),
    [M4(px, y + 0.06, pz, 1, 1, 1, ry), M4(px, y + h - 0.06, pz, 1, 1, 1, ry)], 'Transoms'));
  if (o.glow !== false){
    group.add(glowPanel(w * 0.98, h * 0.82, px - nx * 0.4, cy, pz - nz * 0.4, ry));
  }
}
function punchedFacade(group, w, h, y, z, ry, wallMat, cols, rows){
  const wall = box(w, h, 0.34, wallMat, 0, y + h / 2, z, 'Wall');
  wall.rotation.y = ry; group.add(wall);
  const ww = w / cols * 0.52, wh = h / rows * 0.56;
  const gs = [], rs = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const tx = -w / 2 + w / cols * (c + 0.5);
    const ty = y + h / rows * (r + 0.5);
    const px = tx * Math.cos(ry), pz = z - tx * Math.sin(ry);
    gs.push(M4(px, ty, pz + Math.cos(ry) * 0.16, ww, wh, 1, ry));
    rs.push(M4(px, ty, pz + Math.cos(ry) * 0.2, ww + 0.24, wh + 0.24, 1, ry));
  }
  group.add(instanced(new THREE.BoxGeometry(1, 1, 0.06), mat('glass'), gs, 'Windows'));
  group.add(instanced(new THREE.BoxGeometry(1, 1, 0.06), mat('darkMetal'), rs, 'Window reveals'));
}

/* ── scatter engine ────────────────────────────────────────────── */
const SEASON = {
  spring:{ canopy:['#6d9b3f','#7fae4a','#a8c46b','#d9c6d8'], trunk:'#5a4636', leafScale:0.92 },
  summer:{ canopy:['#3f6b2a','#4c7a31','#5c8a3a','#35602a'], trunk:'#5a4636', leafScale:1.0 },
  autumn:{ canopy:['#a8631f','#c07a22','#8d4a1c','#d09b2c'], trunk:'#4e3d30', leafScale:0.94 },
  winter:{ canopy:['#5e5147','#6b5c50','#544940','#736459'], trunk:'#463a30', leafScale:0.55 }
};
function scatterAll(){
  const S = P.scatter, R = mulberry(S.seed);
  const keepOut = Math.max(P.scene.width, P.scene.depth) * (P.scene.preset === 'block' ? 1.5 : 0.9) + 6;
  const roadZ = -(P.scene.depth / 2 + 20);
  const pick = (n, rMin, rMax, cb) => {
    let guard = 0;
    for (let i = 0; i < n && guard < n * 40; ){
      guard++;
      const a = R() * Math.PI * 2, r = rMin + R() * (rMax - rMin);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (Math.hypot(x, z) < keepOut) continue;
      if (Math.abs(z - roadZ) < 9 && P.scene.road) continue;
      if (slopeAt(x, z) > S.slopeMax) continue;
      cb(x, heightAt(x, z), z, R); i++;
    }
  };
  if (S.trees && S.treeDensity > 0.01){
    const n = Math.round(S.treeDensity * 190);
    const trunks = [], canopies = [], cCols = [], sea = SEASON[S.season] || SEASON.summer;
    pick(n, keepOut + 2, 190, (x, y, z, R) => {
      const h = 4.5 + R() * 6.5, rad = (1.7 + R() * 1.6) * sea.leafScale, rot = R() * Math.PI;
      trunks.push(M4(x, y + h * 0.32, z, 1, h * 0.64, 1, rot));
      canopies.push(M4(x, y + h * 0.78, z, rad, rad * (0.9 + R() * 0.45), rad, rot));
      cCols.push(sea.canopy[(R() * sea.canopy.length) | 0]);
    });
    const tm = new THREE.MeshStandardMaterial({ color:new THREE.Color(sea.trunk), roughness:0.92 });
    const cm = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.86, flatShading:true });
    registerMat(tm); registerMat(cm);
    ROOT.add(instanced(new THREE.CylinderGeometry(0.16, 0.24, 1, 7), tm, trunks, 'Tree trunks'));
    ROOT.add(instanced(new THREE.IcosahedronGeometry(1, 1), cm, canopies, 'Tree canopies', cCols));
  }
  if (S.people && S.peopleDensity > 0.01){
    const n = Math.round(S.peopleDensity * 70), bodies = [], heads = [], cols = [];
    const palette = ['#2c3742','#5a3f36','#7c7266','#3d5464','#8a4a44','#2f4a3a','#6b6b78','#a89a86'];
    pick(n, keepOut + 1, 95, (x, y, z, R) => {
      const s = 0.92 + R() * 0.2, rot = R() * Math.PI * 2;
      bodies.push(M4(x, y + 0.82 * s, z, s, s, s, rot));
      heads.push(M4(x, y + 1.62 * s, z, s, s, s, rot));
      cols.push(palette[(R() * palette.length) | 0]);
    });
    const bm = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.88 });
    const hm = new THREE.MeshStandardMaterial({ color:0xc9a184, roughness:0.72 });
    registerMat(bm); registerMat(hm);
    ROOT.add(instanced(new THREE.CapsuleGeometry(0.19, 0.86, 4, 10), bm, bodies, 'People', cols));
    ROOT.add(instanced(new THREE.SphereGeometry(0.115, 12, 10), hm, heads, 'People heads'));
  }
  if (S.cars && S.carDensity > 0.01 && P.scene.road){
    const n = Math.round(S.carDensity * 22), body = [], cabin = [], wheel = [], cols = [];
    const palette = ['#1b2026','#8d9199','#2f4a6b','#7a2c28','#e8e6e1','#3c4a3f','#5d5a55'];
    for (let i = 0; i < n; i++){
      const x = -140 + R() * 280, lane = R() > 0.5 ? 3.1 : -3.1;
      const rot = lane > 0 ? 0 : Math.PI, z = roadZ + lane;
      const y = 0.12;
      body.push(M4(x, y + 0.62, z, 1, 1, 1, rot));
      cabin.push(M4(x - Math.cos(rot) * 0.25, y + 1.28, z, 1, 1, 1, rot));
      cols.push(palette[(R() * palette.length) | 0]);
      for (const dx of [1.45, -1.45]) for (const dz of [0.88, -0.88])
        wheel.push(M4(x + dx * Math.cos(rot), y + 0.34, z + dz + dx * Math.sin(rot) * 0, 1, 1, 1, rot));
    }
    const cm = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.24, metalness:0.55 });
    const gm = new THREE.MeshStandardMaterial({ color:0x1a2026, roughness:0.08, metalness:0.2 });
    const wm = new THREE.MeshStandardMaterial({ color:0x14171a, roughness:0.94 });
    registerMat(cm); registerMat(gm); registerMat(wm);
    ROOT.add(instanced(new THREE.BoxGeometry(4.5, 0.95, 1.92), cm, body, 'Vehicles', cols));
    ROOT.add(instanced(new THREE.BoxGeometry(2.4, 0.78, 1.76), gm, cabin, 'Vehicle cabins'));
    const wg = new THREE.CylinderGeometry(0.34, 0.34, 0.24, 12); wg.rotateX(Math.PI / 2);

  if (S.props){

    for (let x = -70; x <= 70; x += 17) bench.push(M4(x, heightAt(x, roadZl) + 0.45, roadZl, 1, 1, 1, 0));
    for (let x = -80; x <= 80; x += 6) bollard.push(M4(x, heightAt(x, roadZ + 9.4) + 0.42, roadZ + 9.4, 1, 1, 1, 0));
    ROOT.add(instanced(new THREE.BoxGeometry(1.9, 0.12, 0.52), mat('oak', { tile:[2,1] }), bench, 'Benches'));
    ROOT.add(instanced(new THREE.CylinderGeometry(0.07, 0.09, 0.84, 8), mat('darkMetal'), bollard, 'Bollards'));
  }
}

/* ── build ─────────────────────────────────────────────────────── */
function buildProject(frame){
  clearRoot();
  buildGround();
  const t = (TYPOLOGY[P.scene.preset] || typVilla)();
  t.name = 'Typology'; t.visible = P.scene.showTypology !== false;
  ROOT.add(t);
  if (P.scene.preset !== 'interior'){
    if (P.scene.road) buildRoad();
    if (P.scene.context) buildContext(mulberry(P.scene.seed + 5));
    scatterAll();
  }
  ROOT.add(IMPORTS);
  bounds.makeEmpty();
  if (t.visible) bounds.expandByObject(t);
  if (imports.length) bounds.expandByObject(IMPORTS);
  if (bounds.isEmpty()) bounds.setFromObject(t);
  applyEnvironment();
  regenEnvMap();
  if (frame !== false) frameBounds(bounds, 1.35);
  refreshOutliner(); refreshMaterialList(); updateGeoStats();
  resetAccum();
}

function updateGeoStats(){
  let tris = 0;
  scene.traverse(o => { if (o.isMesh && o.geometry && o.geometry.index)
    tris += (o.geometry.index.count / 3) * (o.isInstancedMesh ? o.count : 1);
    else if (o.isMesh && o.geometry && o.geometry.attributes.position)
    tris += (o.geometry.attributes.position.count / 3) * (o.isInstancedMesh ? o.count : 1); });
  $('#stGeo').textContent = (tris > 1e6 ? (tris / 1e6).toFixed(2) + 'M' : Math.round(tris / 1000) + 'k') + ' tris';
}

/* ===================================================================
   5. CAMERA — lenses, navigation modes, focus, shots
   =================================================================== */
const orbit = new OrbitControls(camera, canvas);
orbit.enableDamping = true; orbit.dampingFactor = 0.075;
orbit.maxPolarAngle = Math.PI * 0.52; orbit.minDistance = 1.2; orbit.maxDistance = 900;
orbit.target.set(0, 6, 0);
orbit.addEventListener('change', resetAccum);

const nav = { fwd:0, side:0, up:0, yaw:0, pitch:0, dragging:false, lx:0, ly:0 };
function applyLens(){
  const sensorH = P.cam.sensor / 1.5;
  camera.fov = 2 * Math.atan(sensorH / (2 * P.cam.focal)) / DEG;
  camera.updateProjectionMatrix(); resetAccum();
}
function frameBounds(b, k){
  if (b.isEmpty()) return;
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3());
  const radius = Math.max(s.x, s.y, s.z) * 0.5 * (k || 1.4);
  const dist = radius / Math.tan(camera.fov * DEG / 2);
  const dir = new THREE.Vector3(0.72, 0.34, 0.86).normalize();
  camera.position.copy(c).addScaledVector(dir, dist);
  orbit.target.copy(c); orbit.update();
  P.cam.focusDist = camera.position.distanceTo(c); resetAccum();
}
function setCamMode(m){
  P.cam.mode = m;
  orbit.enabled = (m === 'orbit');
  if (m === 'walk'){
    const p = camera.position;
    camera.position.set(p.x, heightAt(p.x, p.z) + P.cam.height, p.z);
  }
  const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
  nav.yaw = e.y; nav.pitch = e.x;
  resetAccum();
}
function navUpdate(dt){
  if (P.cam.mode === 'orbit'){ orbit.update(); return; }
  const sp = P.cam.speed * (nav.boost ? 3.2 : 1) * dt;
  if (nav.fwd || nav.side || nav.up){
    const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
    const r = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    if (P.cam.mode === 'walk'){ f.y = 0; f.normalize(); r.y = 0; r.normalize(); }
    camera.position.addScaledVector(f, nav.fwd * sp).addScaledVector(r, nav.side * sp);
    if (P.cam.mode === 'fly') camera.position.y += nav.up * sp;
    if (P.cam.mode === 'walk') camera.position.y = heightAt(camera.position.x, camera.position.z) + P.cam.height;
    resetAccum();
  }
}
const rayc = new THREE.Raycaster();
function pickAt(nx, ny){
  rayc.setFromCamera(new THREE.Vector2(nx, ny), camera);
  const hits = rayc.intersectObjects(ROOT.children, true);
  for (const h of hits){ if (h.object.visible && h.object.name !== 'Interior glow') return h; }
  return null;
}
function autoFocus(){
  if (!P.cam.autoFocus) return;
  const h = pickAt(0, 0);
  if (h) { P.cam.focusDist = h.distance; }
}

/* shots */
function captureShotRecord(name){
  const th = canvas.toDataURL('image/jpeg', 0.72);
  const s = { name: name || ('Shot ' + (P.shots.length + 1)),
    pos: camera.position.toArray().map(v => +v.toFixed(3)),
    tgt: orbit.target.toArray().map(v => +v.toFixed(3)),
    quat: camera.quaternion.toArray().map(v => +v.toFixed(4)),
    focal: P.cam.focal, aperture: P.cam.aperture, focus: P.cam.focusDist,
    hour: P.env.hour, weather: P.env.weather, mode: P.render.mode, thumb: th };
  P.shots.push(s); refreshShots(); return s;
}
function gotoShot(i){
  const s = P.shots[i]; if (!s) return;
  camera.position.fromArray(s.pos);
  if (s.quat) camera.quaternion.fromArray(s.quat);
  orbit.target.fromArray(s.tgt);
  P.cam.focal = s.focal; P.cam.aperture = s.aperture; P.cam.focusDist = s.focus;
  P.env.hour = s.hour; if (s.weather) P.env.weather = s.weather;
  applyLens(); applyEnvironment(); orbit.update(); syncPanels(); resetAccum();
}
function autoShots(){
  const c = bounds.getCenter(new THREE.Vector3()), sz = bounds.getSize(new THREE.Vector3());
  const R = Math.max(sz.x, sz.z) * 0.5, H = sz.y;
  const defs = [
    ['Hero 3/4',      new THREE.Vector3( 1.35,  0.42,  1.55), 32, c.clone().setY(H * 0.42)],
    ['Entrance',      new THREE.Vector3( 0.18,  0.14,  1.05), 28, c.clone().setY(H * 0.22)],
    ['Corner',        new THREE.Vector3(-1.45,  0.30,  1.35), 24, c.clone().setY(H * 0.38)],
    ['Eye level',     new THREE.Vector3( 0.95,  0.06,  1.85), 50, c.clone().setY(1.6)],
    ['Pedestrian',    new THREE.Vector3(-0.55,  0.05,  2.35), 35, c.clone().setY(1.6)],
    ['Street view',   new THREE.Vector3( 0.05,  0.07,  3.10), 85, c.clone().setY(2.4)],
    ['Drone',         new THREE.Vector3( 1.10,  1.35,  1.35), 24, c.clone()],
    ["Bird's eye",    new THREE.Vector3( 0.10,  2.60,  0.55), 35, c.clone()],
    ['Detail',        new THREE.Vector3( 0.42,  0.10,  0.98), 135, c.clone().setY(H * 0.3)],
    ['Elevation',     new THREE.Vector3( 0.00,  0.30,  3.60), 200, c.clone().setY(H * 0.45)]
  ];
  P.shots = P.shots.filter(s => !s.auto);
  const keep = camera.position.clone(), keepT = orbit.target.clone(), keepF = P.cam.focal;
  defs.forEach(d => {
    const dist = Math.max(12, R * 2.2);
    camera.position.copy(c).add(d[1].clone().multiplyScalar(dist * 0.55));
    orbit.target.copy(d[3]); camera.lookAt(d[3]);
    P.cam.focal = d[2]; applyLens();
    const s = { name:d[0], auto:true, pos:camera.position.toArray(), tgt:d[3].toArray(),
      quat:camera.quaternion.toArray(), focal:d[2], aperture:P.cam.aperture,
      focus:camera.position.distanceTo(d[3]), hour:P.env.hour, weather:P.env.weather,
      mode:P.render.mode, thumb:null };
    P.shots.push(s);
  });
  camera.position.copy(keep); orbit.target.copy(keepT); P.cam.focal = keepF; applyLens(); orbit.update();
  refreshShots(); status(defs.length + ' compositions generated — open the Camera dock to review');
}

/* flythrough */
let playing = null;
function playFlythrough(){
  const pts = P.shots.filter(s => !s.auto || true).map(s => new THREE.Vector3().fromArray(s.pos));
  const tgts = P.shots.map(s => new THREE.Vector3().fromArray(s.tgt));
  if (pts.length < 2){ status('Add at least two shots to build a flythrough'); return; }
  const cp = new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
  const ct = new THREE.CatmullRomCurve3(tgts, false, 'catmullrom', 0.35);
  playing = { t:0, dur:Math.max(6, pts.length * 3.4), cp, ct, prevMode:P.render.mode };
  P.render.mode = 'realtime'; syncPanels(); status('Playing flythrough');
}
function stopFly(){ if (playing){ P.render.mode = playing.prevMode; playing = null; syncPanels(); resetAccum(); } }
function flyUpdate(dt){
  if (!playing) return;
  playing.t += dt / playing.dur;
  if (playing.t >= 1){ stopFly(); return; }
  const e = playing.t < 0.5 ? 2 * playing.t * playing.t : 1 - Math.pow(-2 * playing.t + 2, 2) / 2;
  camera.position.copy(playing.cp.getPoint(e));
  const tg = playing.ct.getPoint(e);
  camera.lookAt(tg); orbit.target.copy(tg);
  resetAccum();
}
