/* ── sun path dial (signature element) ─────────────────────────── */
function sunDial(parent){
  const wrap = el('div', 'dial');
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', '0 0 200 200');
  wrap.appendChild(svg); parent.appendChild(wrap);
  const mk = (t, a) => { const n = document.createElementNS(NS, t);
    for (const k in a) n.setAttribute(k, a[k]); svg.appendChild(n); return n; };
  const cx = 100, cy = 100, R = 86;
  mk('circle', { class:'rd', cx, cy, r:R });
  mk('circle', { class:'rd', cx, cy, r:R * 0.667 });
  mk('circle', { class:'rd', cx, cy, r:R * 0.333 });
  mk('line', { class:'horizon', x1:cx - R, y1:cy, x2:cx + R, y2:cy });
  mk('line', { class:'horizon', x1:cx, y1:cy - R, x2:cx, y2:cy + R });
  const ghostA = mk('path', { class:'pathghost', d:'' });
  const ghostB = mk('path', { class:'pathghost', d:'' });
  const path   = mk('path', { class:'pathline', d:'' });
  const glow = mk('circle', { class:'bead', cx, cy, r:8, opacity:'0.18' });
  const bead = mk('circle', { class:'bead', cx, cy, r:3.4 });
  [['N', cx - 3, cy - R - 4], ['S', cx - 3, cy + R + 11],
   ['E', cx + R + 5, cy + 3], ['W', cx - R - 12, cy + 3],
   ['30°', cx + 3, cy - R * 0.667 + 8], ['60°', cx + 3, cy - R * 0.333 + 8]]
    .forEach(l => { const t = mk('text', { class:'lbl', x:l[1], y:l[2] }); t.textContent = l[0]; });
  const project = (az, alt) => {
    const r = R * clamp(1 - alt / (Math.PI / 2), 0, 1);
    const a = az + P.env.north * DEG;
    return [cx + Math.sin(a) * r, cy - Math.cos(a) * r];
  };
  const trace = (month, day) => {
    let d = '', open = false;
    for (let h = 0; h <= 24; h += 0.25){
      const dt = new Date(2025, month - 1, day, Math.floor(h), Math.round((h % 1) * 60), 0);
      const s = sunPosition(P.env.lat, P.env.lon, dt, P.env.tz);
      if (s.altitude < 0){ open = false; continue; }
      const p = project(s.azimuth, s.altitude);
      d += (open ? ' L ' : ' M ') + fmt(p[0], 1) + ' ' + fmt(p[1], 1); open = true;
    }
    return d || 'M 0 0';
  };
  const update = () => {
    path.setAttribute('d', trace(P.env.month, P.env.day));
    ghostA.setAttribute('d', trace(6, 21));
    ghostB.setAttribute('d', trace(12, 21));
    const dt = new Date(2025, P.env.month - 1, P.env.day, Math.floor(P.env.hour), Math.round((P.env.hour % 1) * 60), 0);
    const s = sunPosition(P.env.lat, P.env.lon, dt, P.env.tz);
    const p = project(s.azimuth, Math.max(0, s.altitude));
    const vis = s.altitude > -0.005;
    bead.setAttribute('opacity', vis ? 1 : 0.2);
    glow.setAttribute('opacity', vis ? 0.2 : 0);
    bead.setAttribute('cx', fmt(p[0],1)); bead.setAttribute('cy', fmt(p[1],1));
    glow.setAttribute('cx', fmt(p[0],1)); glow.setAttribute('cy', fmt(p[1],1));
  };
  syncers.push(update); update();
  return wrap;
}

/* ── colour wheels + curve ─────────────────────────────────────── */
function colorWheels(parent){
  const row = el('div', 'wheelrow');
  ['lift', 'gamma', 'gain'].forEach(key => {
    const w = el('div', 'wheel');
    const cv = el('canvas'); cv.width = cv.height = 128;
    const lbl = el('span', null, key.toUpperCase());
    w.append(cv, lbl); row.appendChild(w);
    const ctx = cv.getContext('2d');
    const draw = () => {
      const id = ctx.createImageData(128, 128);
      for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++){
        const dx = (x - 64) / 62, dy = (y - 64) / 62, r = Math.hypot(dx, dy), o = (y * 128 + x) * 4;
        if (r > 1){ id.data[o + 3] = 0; continue; }
        const a = Math.atan2(dy, dx) / (Math.PI * 2) + 0.5;
        const c = new THREE.Color().setHSL(a, clamp(r, 0, 1) * 0.9, 0.5);
        id.data[o] = c.r * 255; id.data[o + 1] = c.g * 255; id.data[o + 2] = c.b * 255; id.data[o + 3] = 210;
      }
      ctx.putImageData(id, 0, 0);
      const v = P.post[key];
      const mag = Math.hypot(v[0], v[1], v[2]);
      const c = new THREE.Color(v[0] + 0.5, v[1] + 0.5, v[2] + 0.5);
      const hsl = { h:0, s:0, l:0 }; c.getHSL(hsl);
      const rr = clamp(mag * 4, 0, 1) * 62;
      const ang = (hsl.h - 0.5) * Math.PI * 2;
      ctx.beginPath(); ctx.arc(64 + Math.cos(ang) * rr, 64 + Math.sin(ang) * rr, 4.5, 0, 7);
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
      ctx.beginPath(); ctx.arc(64, 64, 2, 0, 7); ctx.fillStyle = '#8a97a4'; ctx.fill();
    };
    const setFrom = ev => {
      const r = cv.getBoundingClientRect();
      const dx = ((ev.clientX - r.left) / r.width - 0.5) * 2, dy = ((ev.clientY - r.top) / r.height - 0.5) * 2;
      const mag = clamp(Math.hypot(dx, dy), 0, 1);
      const a = Math.atan2(dy, dx) / (Math.PI * 2) + 0.5;
      const c = new THREE.Color().setHSL(a, 0.95, 0.5);
      const k = mag * 0.25;
      P.post[key] = [(c.r - 0.5) * k * 2, (c.g - 0.5) * k * 2, (c.b - 0.5) * k * 2];
      draw(); applyPost();
    };
    cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); setFrom(e); });
    cv.addEventListener('pointermove', e => { if (e.buttons) setFrom(e); });
    cv.addEventListener('dblclick', () => { P.post[key] = [0, 0, 0]; draw(); applyPost(); });
    syncers.push(draw); draw();
  });
  parent.appendChild(row);
}
function curveEditor(parent){
  const cv = el('canvas', 'curve'); cv.width = 300; cv.height = 210;
  parent.appendChild(cv);
  const ctx = cv.getContext('2d');
  let drag = -1;
  const toPix = p => [p[0] * cv.width, (1 - p[1]) * cv.height];
  const draw = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = '#1b232b'; ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++){ ctx.beginPath();
      ctx.moveTo(cv.width * i / 4, 0); ctx.lineTo(cv.width * i / 4, cv.height);
      ctx.moveTo(0, cv.height * i / 4); ctx.lineTo(cv.width, cv.height * i / 4); ctx.stroke(); }
    ctx.strokeStyle = '#2b3641'; ctx.beginPath(); ctx.moveTo(0, cv.height); ctx.lineTo(cv.width, 0); ctx.stroke();
    ctx.strokeStyle = '#FFB454'; ctx.lineWidth = 1.8; ctx.beginPath();
    for (let i = 0; i <= 255; i++){
      const x = i / 255 * cv.width, y = (1 - curveData[i * 4] / 255) * cv.height;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    P.post.curve.forEach(p => { const q = toPix(p);
      ctx.beginPath(); ctx.arc(q[0], q[1], 4, 0, 7); ctx.fillStyle = '#E9EFF5'; ctx.fill(); });
  };
  const hitTest = (mx, my) => {
    for (let i = 0; i < P.post.curve.length; i++){
      const q = toPix(P.post.curve[i]);
      if (Math.hypot(q[0] - mx, q[1] - my) < 10) return i;
    } return -1;
  };
  cv.addEventListener('pointerdown', e => {
    const r = cv.getBoundingClientRect();
    const mx = (e.clientX - r.left) / r.width * cv.width, my = (e.clientY - r.top) / r.height * cv.height;
    drag = hitTest(mx, my);
    if (drag < 0){ P.post.curve.push([clamp(mx / cv.width, 0, 1), clamp(1 - my / cv.height, 0, 1)]);
      P.post.curve.sort((a, b) => a[0] - b[0]); drag = hitTest(mx, my); }
    cv.setPointerCapture(e.pointerId); rebuildCurve(); draw();
  });
  cv.addEventListener('pointermove', e => {
    if (drag < 0 || !e.buttons) return;
    const r = cv.getBoundingClientRect();
    const x = clamp((e.clientX - r.left) / r.width, 0, 1), y = clamp(1 - (e.clientY - r.top) / r.height, 0, 1);
    const fixed = drag === 0 || drag === P.post.curve.length - 1;
    P.post.curve[drag] = [fixed ? P.post.curve[drag][0] : x, y];
    rebuildCurve(); draw();
  });
  cv.addEventListener('dblclick', e => {
    const r = cv.getBoundingClientRect();
    const i = hitTest((e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height);
    if (i > 0 && i < P.post.curve.length - 1){ P.post.curve.splice(i, 1); rebuildCurve(); draw(); }
  });
  syncers.push(draw); draw();
}

/* ── scopes ────────────────────────────────────────────────────── */
let scopeCanvas = null, scopePixels = new Uint8Array(160 * 90 * 4), scopeTick = 0;
function scopesPanel(parent){
  const cv = el('canvas', 'scope'); cv.width = 300; cv.height = 96; parent.appendChild(cv);
  const cv2 = el('canvas', 'scope'); cv2.width = 300; cv2.height = 96; parent.appendChild(cv2);
  scopeCanvas = { hist:cv.getContext('2d'), wave:cv2.getContext('2d'), w:cv.width, h:cv.height };
}
function drawScopes(){
  if (!scopeCanvas || !P.post.scopes) return;
  const { hist, wave, w, h } = scopeCanvas;
  const bins = [new Float32Array(64), new Float32Array(64), new Float32Array(64)];
  hist.clearRect(0, 0, w, h); wave.clearRect(0, 0, w, h);
  const SW = 160, SH = 90;
  const wimg = wave.createImageData(w, h);
  for (let y = 0; y < SH; y += 1) for (let x = 0; x < SW; x += 1){
    const o = ((SH - 1 - y) * SW + x) * 4;
    const r = scopePixels[o] / 255, g = scopePixels[o + 1] / 255, b = scopePixels[o + 2] / 255;
    bins[0][Math.min(63, (r * 63) | 0)]++; bins[1][Math.min(63, (g * 63) | 0)]++; bins[2][Math.min(63, (b * 63) | 0)]++;
    const px = ((x / SW) * w) | 0;
    [[r, 0], [g, 1], [b, 2]].forEach(([v, ch]) => {
      const py = clamp(h - 1 - ((v * (h - 2)) | 0), 0, h - 1);
      const io = (py * w + px) * 4;
      wimg.data[io + ch] = Math.min(255, wimg.data[io + ch] + 90);
      wimg.data[io + 3] = 255;
    });
  }
  wave.putImageData(wimg, 0, 0);
  wave.strokeStyle = '#1b232b'; wave.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(t => { wave.beginPath(); wave.moveTo(0, h * t); wave.lineTo(w, h * t); wave.stroke(); });
  let mx = 1; for (const b of bins) for (const v of b) mx = Math.max(mx, v);
  const cols = ['rgba(255,90,80,.75)', 'rgba(120,230,140,.75)', 'rgba(90,170,255,.75)'];
  bins.forEach((b, ci) => { hist.fillStyle = cols[ci];
    for (let i = 0; i < 64; i++){ const bh = (b[i] / mx) * (h - 4);
      hist.fillRect(i / 64 * w, h - bh, w / 64 - 1, bh); } });
  hist.strokeStyle = '#1b232b';
  [0.25, 0.5, 0.75].forEach(t => { hist.beginPath(); hist.moveTo(w * t, 0); hist.lineTo(w * t, h); hist.stroke(); });
}

function applyLook(k){
  const L = LOOKS[k]; if (!L) return;
  P.env.hour = L.hour; P.env.weather = L.weather;
  P.post.tonemap = L.tone; P.post.exposure = L.exp; P.post.saturation = L.sat;
  P.post.bloom = L.bloom; P.post.grain = L.grain; P.post.vignette = L.vig; P.post.temperature = L.temp;
  applyEnvironment(); applyPost(); syncPanels(); badge(k.toUpperCase());
}

function applyPost(){
  const q = P.post, off = q.nodesOff;
  const on = n => !off[n];
  cUni.uExposure.value = Math.pow(2, q.exposure);
  cUni.uWB.value.set(q.temperature, q.tint);
  cUni.uContrast.value = on('grade') ? q.contrast : 1;
  cUni.uSat.value      = on('grade') ? q.saturation : 1;
  cUni.uTone.value = { aces:0, filmic:1, agx:2, linear:3 }[q.tonemap] || 0;
  cUni.uBloom.value = on('bloom') ? q.bloom : 0;
  cUni.uDirt.value  = q.dirt;
  cUni.uHal.value   = on('halation') ? q.halation : 0;
  cUni.uRays.value  = on('rays') ? q.rays : 0;
  cUni.uVig.value   = on('vignette') ? q.vignette : 0;
  cUni.uGrain.value = on('grain') ? q.grain : 0;
  cUni.uChroma.value= on('chroma') ? q.chroma : 0;
  cUni.uSharp.value = on('sharpen') ? q.sharpen : 0;
  cUni.uCurveOn.value = on('curve') ? 1 : 0;
  cUni.uLift.value.fromArray(on('grade') ? q.lift : [0,0,0]);
  cUni.uGamma.value.fromArray(on('grade') ? q.gamma : [0,0,0]);
  cUni.uGain.value.fromArray(on('grade') ? q.gain : [0,0,0]);
  cUni.uFalse.value = q.falseColor ? 1 : 0;
  preUni.uThresh.value = q.bloomThreshold;
}

function listItem(parent, label, meta, sel, onClick, swatch){
  const d = el('div', 'item'); d.tabIndex = 0;
  if (swatch){ const s = el('span', 'sw'); s.style.background = swatch; d.appendChild(s); }
  else { const s = el('span', 'dot'); d.appendChild(s); }
  d.appendChild(el('span', null, label));
  if (meta) d.appendChild(el('em', null, meta));
  d.setAttribute('aria-selected', !!sel);
  d.addEventListener('click', onClick);
  d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); onClick(); } });
  parent.appendChild(d); return d;
}
function collectMaterials(){
  const out = new Map();
  ROOT.traverse(o => { if (o.isMesh && o.material){
    const arr = Array.isArray(o.material) ? o.material : [o.material];
    arr.forEach(m => { if (!out.has(m.uuid)) out.set(m.uuid, { m, count:0 }); out.get(m.uuid).count++; }); } });
  return Array.from(out.values());
}

function drawGuides(){
  const svg = $('#guides'); svg.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const W = svg.clientWidth || 1, H = svg.clientHeight || 1;
  const line = (x1, y1, x2, y2, o) => { const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', '#E9EFF5'); l.setAttribute('stroke-width', '1');
    l.setAttribute('opacity', o || 0.22); svg.appendChild(l); };
  const g = P.cam.guide;
  if (g === 'thirds'){ [1/3, 2/3].forEach(t => { line(W*t, 0, W*t, H); line(0, H*t, W, H*t); }); }
  else if (g === 'golden'){ [0.382, 0.618].forEach(t => { line(W*t, 0, W*t, H); line(0, H*t, W, H*t); }); }
  else if (g === 'diag'){ line(0, 0, W, H); line(W, 0, 0, H); line(0, H/2, W/2, 0, .14); line(W, H/2, W/2, H, .14); }
  else if (g === 'grid'){ for (let i = 1; i < 8; i++){ line(W*i/8, 0, W*i/8, H, .12); line(0, H*i/8, W, H*i/8, .12); } }
  if (P.cam.safeFrame){
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', W*0.05); r.setAttribute('y', H*0.05);
    r.setAttribute('width', W*0.9); r.setAttribute('height', H*0.9);
    r.setAttribute('fill', 'none'); r.setAttribute('stroke', '#FFB454');
    r.setAttribute('stroke-dasharray', '5 5'); r.setAttribute('opacity', '0.5'); svg.appendChild(r);
  }
}

function onResize(){
  const v = $('#view');
  const w = Math.max(2, v.clientWidth), h = Math.max(2, v.clientHeight);
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
  const dpr = renderer.getPixelRatio();
  allocTargets(w * dpr * P.render.scale, h * dpr * P.render.scale);
  $('#chipRes').textContent = Math.round(w * dpr * P.render.scale) + '×' + Math.round(h * dpr * P.render.scale);
  drawGuides(); resetAccum();
}

/* ── high-resolution still ─────────────────────────────────────── */
let rendering = false;
async function renderStill(quiet){
  if (rendering) return null;
  rendering = true;
  const v = $('#view'), scale = P.render.printScale;
  const w = Math.max(2, v.clientWidth), h = Math.max(2, v.clientHeight);
  const dpr = renderer.getPixelRatio();
  const W = Math.round(w * dpr * scale), H = Math.round(h * dpr * scale);
  const prevMode = P.render.mode;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  allocTargets(W, H);
  P.render.mode = (prevMode === 'realtime') ? 'hybrid' : prevMode;
  resetAccum();
  const total = Math.max(64, targetSamples());
  $('#ring').hidden = false;
  status('Rendering ' + W + '×' + H + ' — ' + total + ' samples');
  for (let i = 0; i < total; i++){
    renderFrame(0);
    setRing(i / total, Math.round(i / total * 100) + '%');
    if (i % 3 === 0) await new Promise(r => setTimeout(r, 0));
  }
  const url = canvas.toDataURL('image/png');
  P.render.mode = prevMode;
  $('#ring').hidden = true;
  onResize(); rendering = false;
  if (!quiet){
    download((P.meta.name || 'vizion').replace(/\s+/g, '_') + '_' + W + 'x' + H + '.png', url);
    status('Still written — ' + W + '×' + H);
  }
  return url;
}
async function renderQueue(){
  if (!P.shots.length){ status('No shots in the list'); return; }
  for (let i = 0; i < P.shots.length; i++){
    gotoShot(i);
    await new Promise(r => setTimeout(r, 60));
    const url = await renderStill(true);
    P.shots[i].thumb = url;
    download((P.meta.name || 'vizion').replace(/\s+/g, '_') + '_' + P.shots[i].name.replace(/\s+/g, '_') + '.png', url);
  }
  refreshShots(); status('Shot list rendered — ' + P.shots.length + ' images');
}
function setRing(t, label){
  const c = 2 * Math.PI * 22;
  $('#ringArc').setAttribute('stroke-dashoffset', String(c * (1 - clamp(t, 0, 1))));
  $('#ringTxt').textContent = label;
}

function loadProject(json){
  try {
    const d = JSON.parse(json);
    const src = d.project || d;
    P = Object.assign(DEFAULTS(), src);
    ['scene','env','cam','render','post','scatter','lights','meta','boards'].forEach(k =>
      P[k] = Object.assign(DEFAULTS()[k], src[k] || {}));
    rebuildCurve(); applyPost(); applyLens();
    buildProject(false); setWorkspace(WS); status('Project loaded — ' + (P.meta.name || 'untitled'));
  } catch (e){ status('That file is not a VIZION project'); }

function shotImages(){ return P.shots.filter(s => s.thumb); }
function exportContactSheet(){
  const imgs = shotImages();
  if (!imgs.length){ status('Capture at least one shot first'); return; }
  const cols = P.boards.layout === '1up' ? 1 : P.boards.layout === '2up' ? 2 : 3;
  const cw = 900, ch = Math.round(cw * 9 / 16), pad = 26, head = 130;
  const rows = Math.ceil(imgs.length / cols);
  const cv = document.createElement('canvas');
  cv.width = cols * cw + pad * (cols + 1);
  cv.height = head + rows * (ch + 54) + pad;
  const x = cv.getContext('2d');
  x.fillStyle = '#0B0E12'; x.fillRect(0, 0, cv.width, cv.height);
  x.fillStyle = '#FFB454'; x.fillRect(pad, head - 34, 66, 3);
  x.fillStyle = '#E9EFF5'; x.font = '700 40px Archivo, sans-serif';
  x.fillText((P.boards.title || P.meta.name || 'Untitled Project').toUpperCase(), pad, head - 58);
  x.fillStyle = '#8B98A5'; x.font = '400 20px Archivo, sans-serif';
  x.fillText([P.boards.subtitle, P.meta.client, P.meta.typology].filter(Boolean).join('  ·  '), pad, head - 14);
  let done = 0;
  imgs.forEach((s, i) => {
    const im = new Image();
    im.onload = () => {
      const c = i % cols, r = (i / cols) | 0;
      const px = pad + c * (cw + pad), py = head + r * (ch + 54);
      x.drawImage(im, px, py, cw, ch);
      x.strokeStyle = '#232D37'; x.strokeRect(px + .5, py + .5, cw, ch);
      x.fillStyle = '#E9EFF5'; x.font = '600 17px Archivo, sans-serif';
      x.fillText(s.name, px, py + ch + 26);
      x.fillStyle = '#606D7A'; x.font = '400 14px "JetBrains Mono", monospace';
      x.fillText(s.focal + 'mm  f/' + s.aperture + '  ' + fmt(s.hour, 2) + 'h  ' + s.weather, px, py + ch + 45);
      if (++done === imgs.length){
        cv.toBlob(b => { download((P.meta.name || 'vizion').replace(/\s+/g, '_') + '_sheet.png', b);
          status('Contact sheet exported'); }, 'image/png');
      }
    };
    im.src = s.thumb;
  });
}

/* ── model import ──────────────────────────────────────────────────
   Multi-asset import. Every dropped file becomes a blob URL and a
   LoadingManager URL modifier rewires relative references — so a .gltf
   dropped alongside its .bin and textures resolves, and an .obj picks
   up a matching .mtl. Assets coexist; each keeps its own transform.
   ------------------------------------------------------------------ */
const IMPORTS = new THREE.Group(); IMPORTS.name = 'Imports';
const imports = [];
let importSel = 0, importSeq = 0;
const MODEL_ACCEPT = '.glb,.gltf,.obj,.mtl,.fbx,.dae,.stl,.ply,.bin,.hdr,.json,.png,.jpg,.jpeg,.webp';
const MODEL_RE = /\.(glb|gltf|obj|fbx|dae|stl|ply)$/i;
const UNIT_K = { m:1, cm:0.01, mm:0.001, ft:0.3048, in:0.0254 };
const MAT_MODES = [['original','Original'], ['clay','White clay'], ['concrete','Concrete'],
  ['plaster','Plaster'], ['oak','Oak'], ['steel','Steel'], ['aluminium','Aluminium'],
  ['glass','Glass'], ['darkMetal','Dark metal'], ['brick','Brick']];
let clayMat = null;
function clay(){
  if (!clayMat){ clayMat = new THREE.MeshStandardMaterial({ color:0xD9D6D1, roughness:0.86, metalness:0 });
    clayMat.userData.baseRough = 0.86; registerMat(clayMat); }
  return clayMat;
}
function unitScale(r){
  return r.unit === 'auto' ? clamp(26 / r.maxDim, 1e-5, 1e5) : (UNIT_K[r.unit] || 1);
}
function applyImportXform(r){
  const o = r.obj, k = unitScale(r) * r.scale, a = r.rotY * DEG;
  o.scale.setScalar(k); o.rotation.set(0, a, 0);
  const c = r.box.getCenter(new THREE.Vector3()).multiplyScalar(k);
  const ca = Math.cos(a), sa = Math.sin(a);
  const cx = r.center ? (c.x * ca + c.z * sa) : 0;
  const cz = r.center ? (-c.x * sa + c.z * ca) : 0;
  o.position.set(r.pos[0] - cx, r.snap ? -r.box.min.y * k : r.lift, r.pos[1] - cz);
  o.updateMatrixWorld(true);
  resetAccum(); updateGeoStats();
}
function applyImportMat(r){
  const mode = r.matMode;
  r.obj.traverse(o => {
    if (!o.isMesh) return;
    if (mode === 'original') o.material = o.userData._origMat || o.material;
    else if (mode === 'clay') o.material = clay();
    else o.material = mat(mode);
  });
  resetAccum(); refreshMaterialList();
}
function applyImportShadows(r){
  r.obj.traverse(o => { if (o.isMesh){ o.castShadow = r.shadows; o.receiveShadow = r.shadows; } });
  resetAccum();
}
function addImport(obj, name){
  obj.position.set(0, 0, 0); obj.rotation.set(0, 0, 0); obj.scale.setScalar(1);
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  if (box.isEmpty()){ status('That file contained no geometry'); return null; }
  const size = box.getSize(new THREE.Vector3());
  const r = { id:++importSeq, name, obj, box, maxDim:Math.max(size.x, size.y, size.z) || 1,
    unit:'auto', scale:1, rotY:0, pos:[0, 0], lift:0, snap:true, center:true,
    shadows:true, matMode:'original', tris:0, srcSize:size.clone() };
  obj.name = name;
  obj.traverse(o => {
    if (!o.isMesh) return;
    o.userData._origMat = o.material;
    const arr = Array.isArray(o.material) ? o.material : [o.material];
    arr.forEach(m => { if (!m) return;
      m.envMapIntensity = 1;
      if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
      if (m.emissiveMap) m.emissiveMap.colorSpace = THREE.SRGBColorSpace;
      if (m.userData.baseRough == null) m.userData.baseRough = m.roughness != null ? m.roughness : 0.8;
      registerMat(m); });
    if (o.geometry){ const g = o.geometry;
      r.tris += (g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0)) / 3; }
  });
  imports.push(r); IMPORTS.add(obj); importSel = imports.length - 1;
  applyImportXform(r); applyImportShadows(r);
  refreshOutliner(); refreshMaterialList(); updateGeoStats();
  return r;
}
function removeImport(i){
  const r = imports[i]; if (!r) return;
  IMPORTS.remove(r.obj); disposeTree(r.obj);
  imports.splice(i, 1); importSel = clamp(importSel, 0, Math.max(0, imports.length - 1));

  options.forEach(op => { const o = el('option', null, op[1]); o.value = op[0]; sel.appendChild(o); });
  sel.value = value;
  sel.addEventListener('change', () => on(sel.value));
  row.appendChild(sel); return sel;
}
function ntoggle(parent, label, value, on){
  const row = mkRow(parent, label); const b = el('button', 'tgl'); b.type = 'button';
  b.setAttribute('aria-pressed', !!value); b.setAttribute('aria-label', label);
  b.addEventListener('click', () => { const v = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', v); on(v); });
  row.appendChild(b); return b;
}

    const t = ROOT.getObjectByName('Typology'); if (t) t.visible = P.scene.showTypology;
    bounds.makeEmpty();
    if (t && t.visible) bounds.expandByObject(t);
    if (imports.length) bounds.expandByObject(IMPORTS);

    updateGeoStats(); resetAccum(); } });
  hint(io, 'Drop files anywhere on the window. Select a .gltf together with its .bin and texture files and they resolve as one asset; an .obj picks up a matching .mtl. Draco-compressed GLB is supported.');

  if (!imports.length) return;

  const list = el('div', 'list');
  imports.forEach((r, i) => listItem(list, r.name, Math.round(r.tris / 1000) + 'k tri', i === importSel,
    () => { importSel = i; refreshImports(); }));

  const r = imports[clamp(importSel, 0, imports.length - 1)];
  const g = grp(body, 'ASSET — ' + r.name.toUpperCase().slice(0, 22), true,
    fmt(r.srcSize.x, 1) + ' × ' + fmt(r.srcSize.y, 1) + ' × ' + fmt(r.srcSize.z, 1) + ' src');

    ['mm','Millimetres'], ['ft','Feet'], ['in','Inches']], v => { r.unit = v; applyImportXform(r); refreshImports(); });
  slider(g, { label:'Scale', min:0.01, max:20, step:0.01, dec:2, unit:'×',
    get:() => r.scale, on:v => { r.scale = v; applyImportXform(r); } });
  slider(g, { label:'Rotate Y', min:-180, max:180, step:1, dec:0, unit:'°',
    get:() => r.rotY, on:v => { r.rotY = v; applyImportXform(r); } });
  slider(g, { label:'Position X', min:-120, max:120, step:0.1, dec:1, unit:' m',
    get:() => r.pos[0], on:v => { r.pos[0] = v; applyImportXform(r); } });
  slider(g, { label:'Position Z', min:-120, max:120, step:0.1, dec:1, unit:' m',
    get:() => r.pos[1], on:v => { r.pos[1] = v; applyImportXform(r); } });
  slider(g, { label:'Lift', min:-20, max:60, step:0.1, dec:1, unit:' m',
    get:() => r.lift, on:v => { r.lift = v; r.snap = false; applyImportXform(r); } });
  ntoggle(g, 'Snap to ground', r.snap, v => { r.snap = v; applyImportXform(r); });
  ntoggle(g, 'Centre on site', r.center, v => { r.center = v; applyImportXform(r); });
  ntoggle(g, 'Cast and receive shadows', r.shadows, v => { r.shadows = v; applyImportShadows(r); });
  buttons(g, [['FLIP FORWARD 180°', () => { r.rotY = ((r.rotY + 360) % 360) - 180;
                 applyImportXform(r); refreshImports(); }],
              ['DROP ON SITE', () => { r.pos = [0, 0]; r.center = true; r.snap = true;
                 applyImportXform(r); refreshImports(); }],
              ['FRAME ASSET', () => frameBounds(importBox(r), 1.45)]]);

  const m = grp(body, 'ASSET MATERIALS', false, r.matMode === 'original' ? 'as authored' : r.matMode);
  nselect(m, 'Override', r.matMode, MAT_MODES, v => { r.matMode = v; applyImportMat(r); refreshImports(); });
  hint(m, 'Original keeps the materials shipped with the file. Every other option replaces them with a VIZION material, so weather, wetness and the environment map drive them like the rest of the scene.');
  buttons(m, [['REMOVE ASSET', () => removeImport(imports.indexOf(r)), 'gho']]);
}

/* ── loading ───────────────────────────────────────────────────── */
function blobMap(files){
  const map = new Map();
  files.forEach(f => map.set(f.name.toLowerCase(), URL.createObjectURL(f)));
  const mgr = new THREE.LoadingManager();
  mgr.setURLModifier(u => {
    if (/^(blob|data):/i.test(u)) return u;
    const base = decodeURIComponent(String(u).split(/[\\/]/).pop()).toLowerCase();
    return map.get(base) || u;
  });
  return { map, mgr };
}
function gltfLoader(mgr){
  const l = new GLTFLoader(mgr);
  const d = new DRACOLoader();
  d.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/');
  l.setDRACOLoader(d);
  return l;
}
function loadOne(file, ctx){
  const name = file.name, lower = name.toLowerCase(), url = ctx.map.get(lower);
  return new Promise(resolve => {
    const fail = e => { console.warn(e); status('Could not read ' + name); resolve(null); };
    const done = obj => resolve(addImport(obj, name.replace(/\.[^.]+$/, '')));
    try {
      if (/\.(glb|gltf)$/i.test(lower)){
        gltfLoader(ctx.mgr).load(url, g => done(g.scene), null, fail);
      } else if (/\.obj$/i.test(lower)){
        const mtlName = Array.from(ctx.map.keys()).find(k => k.endsWith('.mtl'));
        const run = mats => { const ol = new OBJLoader(ctx.mgr); if (mats) ol.setMaterials(mats);
          ol.load(url, o => { if (!mats) o.traverse(m => { if (m.isMesh) m.material = mat('plaster'); });
            done(o); }, null, fail); };
        if (mtlName){ const ml = new MTLLoader(ctx.mgr);
          ml.load(ctx.map.get(mtlName), mt => { mt.preload(); run(mt); }, null, () => run(null)); }
        else run(null);
      } else if (/\.fbx$/i.test(lower)){
        new FBXLoader(ctx.mgr).load(url, o => done(o), null, fail);
      } else if (/\.dae$/i.test(lower)){
        new ColladaLoader(ctx.mgr).load(url, c => done(c.scene), null, fail);
      } else if (/\.stl$/i.test(lower)){
        new STLLoader(ctx.mgr).load(url, geo => { geo.computeVertexNormals();
          done(new THREE.Mesh(geo, clay())); }, null, fail);
      } else if (/\.ply$/i.test(lower)){
        new PLYLoader(ctx.mgr).load(url, geo => { geo.computeVertexNormals();
          const m = clay().clone(); m.vertexColors = !!geo.attributes.color; registerMat(m);
          done(new THREE.Mesh(geo, m)); }, null, fail);
      } else resolve(null);
    } catch (e){ fail(e); }
  });
}
async function handleFiles(list){
  const files = Array.from(list || []); if (!files.length) return;
  const project = files.find(f => /\.json$/i.test(f.name));
  if (project){ const rd = new FileReader(); rd.onload = () => loadProject(rd.result); rd.readAsText(project); return; }
  const hdr = files.find(f => /\.hdr$/i.test(f.name));
  if (hdr) await loadHDR(hdr);
  const models = files.filter(f => MODEL_RE.test(f.name));
  if (!models.length){
    if (!hdr) status('Nothing importable there — try GLB, glTF, OBJ, FBX, DAE, STL, PLY, HDR or a .json project');
    return;
  }
  const ctx = blobMap(files);
  status('Importing ' + models.length + (models.length > 1 ? ' models…' : ' model…'));
  const added = [];
  for (const f of models){ const r = await loadOne(f, ctx); if (r) added.push(r); }
  ctx.map.forEach(u => setTimeout(() => URL.revokeObjectURL(u), 30000));
  if (!added.length) return;
  status(added.length === 1
    ? added[0].name + ' imported — auto-scaled to fit the site. Set the true source units in the IMPORT panel.'
    : added.length + ' assets imported');
  const t = ROOT.getObjectByName('Typology');
  bounds.makeEmpty();
  if (t && t.visible) bounds.expandByObject(t);
  bounds.expandByObject(IMPORTS);
  frameBounds(importBox(added[added.length - 1]), 1.45);
  if (WS === 'scene') buildRight();
}
function loadHDR(file){
  return new Promise(res => {
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const tex = new RGBELoader().parse(rd.result);
        const t = new THREE.DataTexture(tex.data, tex.width, tex.height, tex.format, tex.type);
        t.needsUpdate = true; t.mapping = THREE.EquirectangularReflectionMapping;
        hdriTex = pmrem.fromEquirectangular(t).texture;
        P.env.useHDRI = true; scene.environment = hdriTex;
        scene.environmentIntensity = P.env.skyIntensity; resetAccum();
        status('HDRI applied — environment lighting is now image-based');
      } catch (e){ status('Could not read that HDR file'); }
      res();
    };
    rd.readAsArrayBuffer(file);
  });
}
function handleFile(file){ handleFiles([file]); }

function buildTabs(){
  const bar = $('#wtabs'); bar.innerHTML = '';
  WORKSPACES.forEach(w => {
    const b = el('button', 'wtab'); b.type = 'button'; b.setAttribute('role', 'tab');
    b.innerHTML = w.label + '<u>' + w.sub + '</u>';
    b.addEventListener('click', () => setWorkspace(w.id));
    b.dataset.id = w.id; bar.appendChild(b);
  });
}
function setWorkspace(id){
  WS = id;
  $$('#wtabs .wtab').forEach(b => b.setAttribute('aria-selected', b.dataset.id === id));
  buildLeft(); buildRight(); buildDock(); drawGuides();
  requestAnimationFrame(onResize);
}
function buildViewTools(){
  const t = $('#vtools'); t.innerHTML = '';
  const mk = (label, fn, pressed) => { const b = el('button', null, label); b.type = 'button';
    b.addEventListener('click', () => { fn(); buildViewTools(); });
    if (pressed) b.setAttribute('aria-pressed', 'true'); t.appendChild(b); return b; };
  ['orbit', 'fly', 'walk'].forEach(m => mk(m.toUpperCase(), () => { setCamMode(m); syncPanels(); }, P.cam.mode === m));
  const guides = ['none', 'thirds', 'golden', 'diag', 'grid'];
  mk('GUIDES', () => { P.cam.guide = guides[(guides.indexOf(P.cam.guide) + 1) % guides.length];
    drawGuides(); syncPanels(); badge(P.cam.guide.toUpperCase()); }, P.cam.guide !== 'none');
  mk('FALSE', () => { P.post.falseColor = !P.post.falseColor; applyPost(); syncPanels(); }, P.post.falseColor);
  mk('FRAME', () => frameBounds(bounds, 1.35));
}

/* interaction */
let look = { on:false, x:0, y:0 };
canvas.addEventListener('pointerdown', e => {
  canvas.focus();
  if (P.cam.mode !== 'orbit' && e.button === 0){ look.on = true; look.x = e.clientX; look.y = e.clientY;
    canvas.setPointerCapture(e.pointerId); }
  if (e.button === 0){
    const r = canvas.getBoundingClientRect();
    const h = pickAt(((e.clientX - r.left) / r.width) * 2 - 1, -(((e.clientY - r.top) / r.height) * 2 - 1));
    if (h){ P.cam.focusDist = h.distance;
      let o = h.object; while (o.parent && o.parent !== ROOT && o.parent.parent !== ROOT && o.parent !== scene) o = o.parent;
      selectObject(h.object); syncPanels(); resetAccum(); }
  }
});
canvas.addEventListener('pointermove', e => {
  if (!look.on) return;
  const dx = e.clientX - look.x, dy = e.clientY - look.y; look.x = e.clientX; look.y = e.clientY;
  nav.yaw -= dx * 0.0032; nav.pitch = clamp(nav.pitch - dy * 0.0032, -1.5, 1.5);
  camera.quaternion.setFromEuler(new THREE.Euler(nav.pitch, nav.yaw, 0, 'YXZ'));
  resetAccum();
});
addEventListener('pointerup', () => { look.on = false; });
addEventListener('keydown', e => {
  if (/input|select|textarea/i.test(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'w') nav.fwd = 1; if (k === 's') nav.fwd = -1;
  if (k === 'a') nav.side = -1; if (k === 'd') nav.side = 1;
  if (k === 'q') nav.up = -1; if (k === 'e') nav.up = 1;
  if (e.shiftKey) nav.boost = true;
  if (k >= '1' && k <= '6'){ setWorkspace(WORKSPACES[+k - 1].id); }
  if (k === 'f'){ e.shiftKey && selObj ? frameBounds(new THREE.Box3().setFromObject(selObj), 1.6) : frameBounds(bounds, 1.35); }
  if (k === 'c'){ captureShotRecord(); badge('CAPTURED'); }
  if (k === 'r' && !e.ctrlKey && !e.metaKey){ e.preventDefault(); renderStill(); }
  if (k === 'g'){ const gs = ['none','thirds','golden','diag','grid'];
    P.cam.guide = gs[(gs.indexOf(P.cam.guide) + 1) % gs.length]; drawGuides(); syncPanels(); buildViewTools(); }
  if (k === 'h' || k === '?') openHelp();
  if (k === 'i') openInfo('about');
  if (k === 'escape') $('#modal').classList.remove('on');
  if (e.code === 'Space'){ e.preventDefault(); playing ? stopFly() : playFlythrough(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'w' || k === 's') nav.fwd = 0;
  if (k === 'a' || k === 'd') nav.side = 0;
  if (k === 'q' || k === 'e') nav.up = 0;
  if (!e.shiftKey) nav.boost = false;
});

/* auto exposure */
let expoSmooth = 0;
function autoExpose(){
  if (P.cam.exposureMode !== 'auto') return;
  let sum = 0, n = 0;
  for (let i = 0; i < scopePixels.length; i += 16){
    sum += (scopePixels[i] * 0.2126 + scopePixels[i + 1] * 0.7152 + scopePixels[i + 2] * 0.0722) / 255; n++;
  }
  if (!n) return;
  const mean = sum / n;
  const err = 0.44 - mean;
  expoSmooth = lerp(expoSmooth, err, 0.25);
  if (Math.abs(expoSmooth) > 0.004){
    P.post.exposure = clamp(P.post.exposure + expoSmooth * 1.15, -5, 6);
    applyPost();
  }
}

/* HUD */
let hudTick = 0;
function updateHUD(fps){
  const tl = $('#hudTL'), tr = $('#hudTR'), bl = $('#hudBL');
  const looksLike = { villa:'Residential villa', tower:'Commercial tower', pavilion:'Gallery pavilion',
    block:'Perimeter block', interior:'Interior' }[P.scene.preset];
  tl.innerHTML = '<span><b>' + (P.meta.name || 'UNTITLED').toUpperCase() + '</b></span>' +
    '<span>' + looksLike + ' · ' + P.meta.typology + '</span>';
  const hh = Math.floor(P.env.hour), mm = Math.round((P.env.hour % 1) * 60);
  tr.innerHTML = '<span>' + P.cam.focal + 'mm  f/' + fmt(P.cam.aperture, 1) + '</span>' +
    '<span>focus ' + fmt(P.cam.focusDist, 1) + ' m</span>' +
    '<span><b>' + String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + '</b> · ' + P.env.weather + '</span>';
  const maxS = targetSamples();
  bl.innerHTML = '<span>' + P.render.mode.toUpperCase() + '</span>' +
    '<span>' + Math.min(sample, maxS) + ' / ' + maxS + ' spp</span>' +
    '<span>EV ' + fmt(P.post.exposure, 2) + (P.cam.exposureMode === 'auto' ? ' auto' : '') + '</span>';
  $('#stFps').textContent = Math.round(fps) + ' fps';
  $('#stSamples').textContent = 'samples ' + Math.min(sample, maxS) + '/' + maxS;
  $('#chipMode').innerHTML = 'MODE <b>' + P.render.mode.toUpperCase() + '</b>';
  const done = sample >= maxS;
  $('#ring').hidden = done || rendering;
  if (!done) setRing(sample / maxS, Math.round(sample / maxS * 100) + '%');
}

/* main loop */
let last = performance.now(), fps = 60, frame = 0;
function tick(){
  requestAnimationFrame(tick);
  if (rendering) return;
  const now = performance.now();
  const dt = Math.min(0.06, (now - last) / 1000); last = now;
  fps = lerp(fps, 1 / Math.max(dt, 0.0001), 0.08);
  frame++;

  flyUpdate(dt); navUpdate(dt);
  if (P.render.mode === 'realtime' || playing){ skyUni.uTime.value += dt; if (P.env.clouds > 0) resetAccum(); }
  if (precip){
    precip.material.uniforms.uCam.value.copy(camera.position);
    if (P.render.mode === 'realtime' || playing){
      precip.material.uniforms.uTime.value += dt; resetAccum();
    }
  }
  if (envDirty && now - envTimer > 220){ envTimer = now; regenEnvMap(); resetAccum(); }
  if (P.cam.autoFocus && frame % 20 === 0) autoFocus();

  // sun screen position for light rays
  const sp = sunLight.position.clone().project(camera);
  cUni.uSunUV.value.set(sp.x * 0.5 + 0.5, sp.y * 0.5 + 0.5,
    (sp.z < 1 && sunLight.intensity > 0.01) ? 1 : 0);

  renderFrame(dt);

  if ((P.post.scopes || P.cam.exposureMode === 'auto') && frame % 6 === 0){
    blit(cMat, scopeRT);
    try {
      renderer.readRenderTargetPixels(scopeRT, 0, 0, 160, 90, scopePixels);
      autoExpose(); if (P.post.scopes && WS === 'post') drawScopes();
    } catch (e){}
    renderer.setRenderTarget(null);
  }
  if (frame % 8 === 0) updateHUD(fps);
}

/* ── boot ──────────────────────────────────────────────────────── */
function boot(){
  rebuildCurve(); applyPost(); applyLens();
  buildTabs(); buildViewTools();
  onResize();
  buildProject(true);
  setWorkspace('scene');
  updateHUD(60);
  window.__VIZION_READY = true;
  status('VIZION ready — press H for the reference sheet');
  tick();
}
boot();
